<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYT MUSIC - Admin Backgrounds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-900 to-purple-900 min-h-screen">
    
    <!-- Header -->
    <div class="bg-white shadow-lg p-4 mb-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">
                <i class="fas fa-images mr-2 text-blue-600"></i>
                VYT MUSIC - Gestión de Fondos
            </h1>
            <a href="index.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-home mr-1"></i>Ir al Sitio
            </a>
        </div>
    </div>

    <div class="container mx-auto px-4">
        
        <!-- Grid de Páginas -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- Página Principal -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <i class="fas fa-home text-blue-500 text-xl mr-3"></i>
                    <h3 class="text-lg font-bold">Página Principal</h3>
                </div>
                <div class="bg-gray-100 rounded-lg h-40 mb-4 overflow-hidden">
                    <img id="img-index" src="" alt="Preview" class="w-full h-full object-cover hidden">
                    <div id="placeholder-index" class="w-full h-full flex items-center justify-center text-gray-500">
                        <div class="text-center">
                            <i class="fas fa-image text-3xl mb-2"></i>
                            <p>Sin imagen</p>
                        </div>
                    </div>
                </div>
                <input type="file" id="file-index" accept="image/*" class="w-full mb-3 p-2 border rounded">
                <button onclick="guardarFondo('index')" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 font-semibold">
                    <i class="fas fa-save mr-2"></i>Aplicar Fondo
                </button>
                <div id="status-index" class="mt-2 text-sm"></div>
            </div>

            <!-- Perfil de Artista -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <i class="fas fa-user text-purple-500 text-xl mr-3"></i>
                    <h3 class="text-lg font-bold">Perfil de Artista</h3>
                </div>
                <div class="bg-gray-100 rounded-lg h-40 mb-4 overflow-hidden">
                    <img id="img-perfil-artista" src="" alt="Preview" class="w-full h-full object-cover hidden">
                    <div id="placeholder-perfil-artista" class="w-full h-full flex items-center justify-center text-gray-500">
                        <div class="text-center">
                            <i class="fas fa-image text-3xl mb-2"></i>
                            <p>Sin imagen</p>
                        </div>
                    </div>
                </div>
                <input type="file" id="file-perfil-artista" accept="image/*" class="w-full mb-3 p-2 border rounded">
                <button onclick="guardarFondo('perfil-artista')" class="w-full bg-purple-500 text-white py-3 rounded-lg hover:bg-purple-600 font-semibold">
                    <i class="fas fa-save mr-2"></i>Aplicar Fondo
                </button>
                <div id="status-perfil-artista" class="mt-2 text-sm"></div>
            </div>

            <!-- Fan Mode -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <i class="fas fa-star text-pink-500 text-xl mr-3"></i>
                    <h3 class="text-lg font-bold">Modo Fan</h3>
                </div>
                <div class="bg-gray-100 rounded-lg h-40 mb-4 overflow-hidden">
                    <img id="img-fan-mode" src="" alt="Preview" class="w-full h-full object-cover hidden">
                    <div id="placeholder-fan-mode" class="w-full h-full flex items-center justify-center text-gray-500">
                        <div class="text-center">
                            <i class="fas fa-image text-3xl mb-2"></i>
                            <p>Sin imagen</p>
                        </div>
                    </div>
                </div>
                <input type="file" id="file-fan-mode" accept="image/*" class="w-full mb-3 p-2 border rounded">
                <button onclick="guardarFondo('fan-mode')" class="w-full bg-pink-500 text-white py-3 rounded-lg hover:bg-pink-600 font-semibold">
                    <i class="fas fa-save mr-2"></i>Aplicar Fondo
                </button>
                <div id="status-fan-mode" class="mt-2 text-sm"></div>
            </div>

            <!-- Login de Artista -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <i class="fas fa-sign-in-alt text-green-500 text-xl mr-3"></i>
                    <h3 class="text-lg font-bold">Login de Artista</h3>
                </div>
                <div class="bg-gray-100 rounded-lg h-40 mb-4 overflow-hidden">
                    <img id="img-login-artista" src="" alt="Preview" class="w-full h-full object-cover hidden">
                    <div id="placeholder-login-artista" class="w-full h-full flex items-center justify-center text-gray-500">
                        <div class="text-center">
                            <i class="fas fa-image text-3xl mb-2"></i>
                            <p>Sin imagen</p>
                        </div>
                    </div>
                </div>
                <input type="file" id="file-login-artista" accept="image/*" class="w-full mb-3 p-2 border rounded">
                <button onclick="guardarFondo('login-artista')" class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 font-semibold">
                    <i class="fas fa-save mr-2"></i>Aplicar Fondo
                </button>
                <div id="status-login-artista" class="mt-2 text-sm"></div>
            </div>

            <!-- Certámenes -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <i class="fas fa-trophy text-yellow-500 text-xl mr-3"></i>
                    <h3 class="text-lg font-bold">Certámenes</h3>
                </div>
                <div class="bg-gray-100 rounded-lg h-40 mb-4 overflow-hidden">
                    <img id="img-certamenes" src="" alt="Preview" class="w-full h-full object-cover hidden">
                    <div id="placeholder-certamenes" class="w-full h-full flex items-center justify-center text-gray-500">
                        <div class="text-center">
                            <i class="fas fa-image text-3xl mb-2"></i>
                            <p>Sin imagen</p>
                        </div>
                    </div>
                </div>
                <input type="file" id="file-certamenes" accept="image/*" class="w-full mb-3 p-2 border rounded">
                <button onclick="guardarFondo('certamenes')" class="w-full bg-yellow-500 text-white py-3 rounded-lg hover:bg-yellow-600 font-semibold">
                    <i class="fas fa-save mr-2"></i>Aplicar Fondo
                </button>
                <div id="status-certamenes" class="mt-2 text-sm"></div>
            </div>

            <!-- Nosotros -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <i class="fas fa-users text-indigo-500 text-xl mr-3"></i>
                    <h3 class="text-lg font-bold">Nosotros</h3>
                </div>
                <div class="bg-gray-100 rounded-lg h-40 mb-4 overflow-hidden">
                    <img id="img-nosotros" src="" alt="Preview" class="w-full h-full object-cover hidden">
                    <div id="placeholder-nosotros" class="w-full h-full flex items-center justify-center text-gray-500">
                        <div class="text-center">
                            <i class="fas fa-image text-3xl mb-2"></i>
                            <p>Sin imagen</p>
                        </div>
                    </div>
                </div>
                <input type="file" id="file-nosotros" accept="image/*" class="w-full mb-3 p-2 border rounded">
                <button onclick="guardarFondo('nosotros')" class="w-full bg-indigo-500 text-white py-3 rounded-lg hover:bg-indigo-600 font-semibold">
                    <i class="fas fa-save mr-2"></i>Aplicar Fondo
                </button>
                <div id="status-nosotros" class="mt-2 text-sm"></div>
            </div>

        </div>

        <!-- Panel de Control -->
        <div class="mt-8 bg-white rounded-lg shadow-lg p-6">
            <h3 class="text-lg font-bold mb-4">
                <i class="fas fa-cogs mr-2 text-gray-600"></i>Panel de Control
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="cargarTodosLosFondos()" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
                    <i class="fas fa-sync mr-2"></i>Recargar Fondos
                </button>
                <button onclick="limpiarTodo()" class="bg-red-500 text-white py-2 px-4 rounded hover:bg-red-600">
                    <i class="fas fa-trash mr-2"></i>Limpiar Todo
                </button>
                <button onclick="exportarConfig()" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600">
                    <i class="fas fa-download mr-2"></i>Exportar
                </button>
            </div>
        </div>

        <!-- Status Global -->
        <div id="status-global" class="mt-4 text-center text-white"></div>
    </div>

    <script>
        // 🎨 SISTEMA DE FONDOS COMPLETAMENTE NUEVO Y FUNCIONAL
        
        function guardarFondo(pagina) {
            console.log('🎨 Guardando fondo para:', pagina);
            
            const archivo = document.getElementById('file-' + pagina).files[0];
            const img = document.getElementById('img-' + pagina);
            const placeholder = document.getElementById('placeholder-' + pagina);
            const status = document.getElementById('status-' + pagina);
            
            if (!archivo) {
                mostrarStatus(status, '❌ Selecciona una imagen', 'error');
                return;
            }
            
            mostrarStatus(status, '⏳ Procesando...', 'info');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imageData = e.target.result;
                    
                    // Guardar en localStorage
                    let config = JSON.parse(localStorage.getItem('backgroundConfig') || '{}');
                    config[pagina] = {
                        imageData: imageData,
                        fileName: archivo.name,
                        timestamp: new Date().toISOString()
                    };
                    localStorage.setItem('backgroundConfig', JSON.stringify(config));
                    
                    // Actualizar preview
                    img.src = imageData;
                    img.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    
                    mostrarStatus(status, '✅ Fondo aplicado', 'success');
                    mostrarStatusGlobal('✅ Fondo guardado para ' + pagina);
                    
                    console.log('✅ Fondo guardado exitosamente para:', pagina);
                    
                } catch (error) {
                    console.error('❌ Error:', error);
                    mostrarStatus(status, '❌ Error al guardar', 'error');
                }
            };
            
            reader.readAsDataURL(archivo);
        }
        
        function mostrarStatus(elemento, mensaje, tipo) {
            elemento.textContent = mensaje;
            elemento.className = 'mt-2 text-sm ';
            
            if (tipo === 'success') elemento.className += 'text-green-600';
            else if (tipo === 'error') elemento.className += 'text-red-600';
            else elemento.className += 'text-blue-600';
        }
        
        function mostrarStatusGlobal(mensaje) {
            const statusGlobal = document.getElementById('status-global');
            statusGlobal.textContent = mensaje;
            setTimeout(() => statusGlobal.textContent = '', 3000);
        }
        
        function cargarTodosLosFondos() {
            console.log('🔄 Cargando todos los fondos...');
            
            try {
                const config = JSON.parse(localStorage.getItem('backgroundConfig') || '{}');
                let cargados = 0;
                
                for (const [pagina, datos] of Object.entries(config)) {
                    if (datos.imageData) {
                        const img = document.getElementById('img-' + pagina);
                        const placeholder = document.getElementById('placeholder-' + pagina);
                        
                        if (img && placeholder) {
                            img.src = datos.imageData;
                            img.classList.remove('hidden');
                            placeholder.classList.add('hidden');
                            cargados++;
                        }
                    }
                }
                
                mostrarStatusGlobal(`✅ ${cargados} fondos cargados`);
                
            } catch (error) {
                console.error('❌ Error cargando fondos:', error);
                mostrarStatusGlobal('❌ Error cargando fondos');
            }
        }
        
        function limpiarTodo() {
            if (confirm('¿Estás seguro de que quieres eliminar todos los fondos?')) {
                localStorage.removeItem('backgroundConfig');
                location.reload();
            }
        }
        
        function exportarConfig() {
            const config = localStorage.getItem('backgroundConfig');
            if (config) {
                const blob = new Blob([config], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'vyt-backgrounds-config.json';
                a.click();
                URL.revokeObjectURL(url);
                mostrarStatusGlobal('✅ Configuración exportada');
            } else {
                mostrarStatusGlobal('❌ No hay configuración para exportar');
            }
        }
        
        // Cargar fondos al iniciar
        document.addEventListener('DOMContentLoaded', cargarTodosLosFondos);
        
        console.log('🎨 Sistema de fondos VYT MUSIC cargado');
    </script>
</body>
</html>
