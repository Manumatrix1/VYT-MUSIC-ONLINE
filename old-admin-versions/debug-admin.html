<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Admin - Verificar Datos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-info { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .warning { background-color: #fff3cd; color: #856404; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; white-space: pre-wrap; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🔧 Debug Admin - Verificar Datos</h1>
    <div id="debug-results"></div>
    
    <button onclick="checkFirebaseAvailability()">1. Verificar Firebase</button>
    <button onclick="checkCollectionData()">2. Verificar Datos</button>
    <button onclick="checkAdminFunctions()">3. Verificar Funciones Admin</button>
    <button onclick="forceRealData()">4. Forzar Datos Reales</button>

    <!-- Firebase Scripts -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, query, orderBy, limit, where, doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
        
        // Hacer db disponible globalmente
        window.firebaseDB = db;
        window.firestoreQuery = { collection, getDocs, query, orderBy, limit, where, doc, getDoc, updateDoc };
        
        function addDebugInfo(message, type = 'debug-info') {
            const results = document.getElementById('debug-results');
            const div = document.createElement('div');
            div.className = `debug-info ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
            console.log(message);
        }

        window.checkFirebaseAvailability = function() {
            addDebugInfo('🔍 Verificando disponibilidad de Firebase...', 'debug-info');
            
            addDebugInfo(`✅ window.firebaseDB: ${!!window.firebaseDB}`, window.firebaseDB ? 'success' : 'error');
            addDebugInfo(`✅ window.firestoreQuery: ${!!window.firestoreQuery}`, window.firestoreQuery ? 'success' : 'error');
            
            if (window.firebaseDB) {
                addDebugInfo(`📊 Firebase DB App: ${window.firebaseDB.app.name}`, 'success');
                addDebugInfo(`🎯 Project ID: ${window.firebaseDB._delegate._databaseId.projectId}`, 'success');
            }
        };

        window.checkCollectionData = async function() {
            if (!window.firebaseDB || !window.firestoreQuery) {
                addDebugInfo('❌ Firebase no disponible', 'error');
                return;
            }

            try {
                const { collection, getDocs } = window.firestoreQuery;
                const db = window.firebaseDB;

                addDebugInfo('🔍 Verificando datos en las colecciones...', 'debug-info');

                // Verificar participantes
                const participantesRef = collection(db, 'participantes');
                const participantesSnapshot = await getDocs(participantesRef);
                addDebugInfo(`👥 Participantes: ${participantesSnapshot.size} documentos`, participantesSnapshot.size > 0 ? 'success' : 'warning');
                
                if (participantesSnapshot.size > 0) {
                    const firstDoc = participantesSnapshot.docs[0];
                    addDebugInfo(`📄 Primer participante: <pre>${JSON.stringify(firstDoc.data(), null, 2)}</pre>`, 'debug-info');
                }

                // Verificar certámenes
                const certamenesRef = collection(db, 'certamenes');
                const certamenesSnapshot = await getDocs(certamenesRef);
                addDebugInfo(`🏆 Certámenes: ${certamenesSnapshot.size} documentos`, certamenesSnapshot.size > 0 ? 'success' : 'warning');

                // Verificar transacciones
                const transaccionesRef = collection(db, 'vyt_money_transactions');
                const transaccionesSnapshot = await getDocs(transaccionesRef);
                addDebugInfo(`💰 Transacciones VYT-Money: ${transaccionesSnapshot.size} documentos`, transaccionesSnapshot.size > 0 ? 'success' : 'warning');

            } catch (error) {
                addDebugInfo(`❌ Error verificando datos: ${error.message}`, 'error');
                addDebugInfo(`<pre>${error.stack}</pre>`, 'error');
            }
        };

        window.checkAdminFunctions = function() {
            addDebugInfo('🔍 Verificando funciones del admin...', 'debug-info');
            
            const functions = ['loadInicioStats', 'loadRealDataStats', 'loadSimulatedStats', 'loadParticipantesOnline'];
            functions.forEach(funcName => {
                const exists = typeof window[funcName] === 'function';
                addDebugInfo(`📋 ${funcName}: ${exists ? '✅ Disponible' : '❌ No encontrada'}`, exists ? 'success' : 'error');
            });
        };

        window.forceRealData = async function() {
            addDebugInfo('🚀 Forzando carga de datos reales...', 'debug-info');
            
            if (typeof window.loadRealDataStats === 'function') {
                try {
                    await window.loadRealDataStats();
                    addDebugInfo('✅ loadRealDataStats ejecutado', 'success');
                } catch (error) {
                    addDebugInfo(`❌ Error en loadRealDataStats: ${error.message}`, 'error');
                }
            } else {
                addDebugInfo('❌ Función loadRealDataStats no disponible', 'error');
            }
        };

        // Auto-ejecutar verificaciones básicas al cargar
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkFirebaseAvailability();
                setTimeout(() => {
                    checkCollectionData();
                }, 1000);
            }, 500);
        });
    </script>
</body>
</html>
