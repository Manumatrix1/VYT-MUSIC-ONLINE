<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset y Admin - VYT Music Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
        }
        button:hover { background: #3367d6; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success { background: #e8f5e8; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
        .step { margin: 15px 0; padding: 15px; background: #f0f0f0; border-radius: 5px; }
        .reset-btn { background: #ff9800; }
        .reset-btn:hover { background: #f57c00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Acceso de Administrador</h1>
        
        <div class="step">
            <h3>Opción 1: Resetear Contraseña</h3>
            <p>Si no recuerdas tu contraseña, te enviaremos un email para resetearla.</p>
            <button onclick="resetPassword()" class="reset-btn">📧 Enviar Reset de Contraseña</button>
        </div>
        
        <div class="step">
            <h3>Opción 2: Login Manual</h3>
            <p>Email: <strong>luciano21martinez@gmail.com</strong></p>
            <input type="password" id="password" placeholder="Contraseña" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px;">
            <button onclick="loginManual()">🔑 Iniciar Sesión</button>
        </div>
        
        <div class="step">
            <h3>Después del Login:</h3>
            <button onclick="makeUserAdmin()" id="adminBtn" disabled>👑 Configurar como Admin</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { 
            signInWithEmailAndPassword, 
            sendPasswordResetEmail,
            onAuthStateChanged 
        } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        const email = 'luciano21martinez@gmail.com';

        function showResult(message, type = 'success') {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.textContent = message;
        }

        // Monitorear estado de autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                showResult(`✅ ¡Usuario conectado!
Email: ${user.email}
UID: ${user.uid}

Ahora puedes hacer click en "Configurar como Admin"`, 'success');
                document.getElementById('adminBtn').disabled = false;
            } else {
                showResult('❌ No hay usuario conectado. Usa una de las opciones de arriba.', 'error');
                document.getElementById('adminBtn').disabled = true;
            }
        });

        window.resetPassword = async function() {
            try {
                showResult('📧 Enviando email de reset...', 'success');
                await sendPasswordResetEmail(auth, email);
                showResult(`✅ ¡Email de reset enviado!

Revisa tu bandeja de entrada (y spam) en: ${email}

1. Abre el email de Firebase
2. Haz click en el enlace
3. Crea una nueva contraseña
4. Vuelve aquí y usa "Login Manual"`, 'success');
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ Error enviando reset: ${error.message}`, 'error');
            }
        };

        window.loginManual = async function() {
            const password = document.getElementById('password').value;
            if (!password) {
                showResult('❌ Ingresa tu contraseña', 'error');
                return;
            }
            
            try {
                showResult('🔑 Iniciando sesión...', 'success');
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ Error de login: ${error.message}

¿Contraseña incorrecta? Usa "Enviar Reset de Contraseña"`, 'error');
            }
        };

        window.makeUserAdmin = async function() {
            const user = auth.currentUser;
            if (!user) {
                showResult('❌ Primero debes iniciar sesión', 'error');
                return;
            }
            
            try {
                showResult('👑 Configurando como administrador...', 'success');
                
                await setDoc(doc(db, 'users', user.uid), {
                    email: user.email,
                    displayName: user.displayName || 'Luciano Martinez',
                    role: 'admin',
                    created_at: serverTimestamp(),
                    updated_at: serverTimestamp(),
                    vyt_money_balance: 0,
                    total_votes: 0,
                    status: 'active'
                });

                showResult(`🎉 ¡ADMINISTRADOR CONFIGURADO!

Email: ${user.email}
Rol: Admin
Estado: Activo

🚀 Ya puedes acceder al panel de administración desde la página principal!`, 'success');
                
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ Error configurando admin: ${error.message}`, 'error');
            }
        };

        console.log('🚀 Página de reset y admin lista!');
    </script>
</body>
</html>
