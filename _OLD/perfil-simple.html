<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - VYT MUSIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="src/notification-system.js"></script>
    <style>
        body {
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.5)), url('images/fotos/inscripcion-background.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
        }
        
        .profile-card {
            background: rgba(30, 41, 59, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .stat-card {
            background: rgba(55, 65, 81, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(156, 163, 175, 0.3);
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(55, 65, 81, 0.35);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-weight: bold;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .certamen-card {
            background: rgba(30, 41, 59, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .certamen-card:hover {
            background: rgba(30, 41, 59, 0.4);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        /* Optimizaciones adicionales para mobile */
        @media (max-width: 768px) {
            .profile-card {
                padding: 1rem;
            }
            
            .stat-card {
                padding: 0.75rem;
            }
            
            .btn-primary, .btn-secondary {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }
            
            .container {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-gray-900/95 backdrop-blur-sm border-b border-gray-700 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3">
            <nav class="flex items-center justify-between">
                <!-- Logo y brand -->
                <div class="flex items-center space-x-3">
                    <a href="principal.html" class="flex items-center space-x-2 hover:opacity-80 transition-opacity">
                        <img src="https://i.ibb.co/Ldwq7cNx/logo-blanco.png" alt="VYT MUSIC Logo" class="w-8 h-8 md:w-10 md:h-10">
                        <!-- Logo para pantallas pequeñas y medianas -->
                        <div class="hidden sm:block">
                            <span class="font-bold text-lg md:text-xl text-white">VYT MUSIC</span>
                            <div class="text-xs text-blue-200 hidden md:block">Tu plataforma musical</div>
                        </div>
                    </a>
                    <span class="bg-blue-500 text-white px-2 py-1 md:px-3 md:py-1 rounded-full text-xs md:text-sm font-semibold">ARTISTA</span>
                </div>
                
                <!-- Navegación responsive -->
                <div class="flex items-center space-x-2 md:space-x-4">
                    <!-- Botón Principal (siempre visible) -->
                    <a href="principal.html" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 md:px-3 md:py-2 rounded-lg text-xs md:text-sm transition-colors">
                        <i class="fas fa-home mr-1"></i>
                        <span class="hidden sm:inline">Principal</span>
                    </a>
                    
                    <!-- Modo Fan (responsive) -->
                    <a href="fan-mode.html" class="text-gray-300 hover:text-white transition-colors px-2 py-1 rounded text-xs md:text-sm">
                        <i class="fas fa-eye mr-1"></i>
                        <span class="hidden md:inline">Ver como Fan</span>
                        <span class="md:hidden">Fan</span>
                    </a>
                    
                    <!-- Cerrar sesión (responsive) -->
                    <button onclick="logout()" class="text-red-400 hover:text-red-300 transition-colors px-2 py-1 rounded text-xs md:text-sm">
                        <i class="fas fa-sign-out-alt mr-1"></i>
                        <span class="hidden md:inline">Cerrar Sesión</span>
                        <span class="md:hidden">Salir</span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <div class="container mx-auto px-4 py-8">
        <!-- Perfil del Artista -->
        <div class="profile-card mb-8">
            <div class="flex flex-col md:flex-row items-center md:items-start space-y-6 md:space-y-0 md:space-x-8">
                <!-- Foto de Perfil -->
                <div class="flex-shrink-0 text-center">
                    <div class="w-32 h-32 rounded-full overflow-hidden bg-gradient-to-br from-blue-500 to-purple-600 p-1 mb-4 mx-auto">
                        <div id="profilePhotoContainer" class="w-full h-full rounded-full bg-gray-700 flex items-center justify-center">
                            <i class="fas fa-user text-4xl text-gray-400" id="defaultAvatar"></i>
                            <img id="profilePhoto" class="w-full h-full object-cover rounded-full hidden" alt="Foto de perfil">
                        </div>
                    </div>
                    <input type="file" id="photoInput" accept="image/*" class="hidden">
                    <button onclick="changePhoto()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm transition-colors text-white mr-2">
                        <i class="fas fa-camera"></i> Cambiar Foto
                    </button>
                    <button id="savePhotoBtn" onclick="savePhoto()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm transition-colors text-white hidden">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
                
                <!-- Información del Artista -->
                <div class="flex-1 text-center md:text-left">
                    <h1 class="text-3xl font-bold mb-2 text-white" id="artistName">Tu Nombre Artístico</h1>
                    <p class="text-blue-300 text-lg mb-4" id="realName">Nombre Real</p>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-gray-800/50 rounded-lg p-3">
                            <div class="text-blue-400 text-sm">Género Musical</div>
                            <div class="font-bold text-white text-sm md:text-base" id="musicGenre">-</div>
                        </div>
                        <div class="bg-gray-800/50 rounded-lg p-3">
                            <div class="text-blue-400 text-sm">Ciudad</div>
                            <div class="font-bold text-white text-sm md:text-base" id="cityName">-</div>
                        </div>
                        <div class="bg-gray-800/50 rounded-lg p-3 col-span-2">
                            <div class="text-blue-400 text-sm">Teléfono</div>
                            <div class="font-bold text-white text-sm md:text-base" id="phoneNumber">-</div>
                        </div>
                    </div>
                    
                    <!-- Acciones Rápidas -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onclick="editProfile()" class="btn-secondary text-sm md:text-base">
                            <i class="fas fa-edit"></i> Editar Perfil
                        </button>
                        <a href="principal.html#certamenes" class="btn-primary text-sm md:text-base text-center">
                            <i class="fas fa-trophy"></i> Ver Certámenes
                        </a>
                        <a href="certamen-individual.html?id=certamen-rosario-2025" class="btn-primary text-sm md:text-base sm:col-span-2 text-center">
                            <i class="fas fa-plus"></i> Inscribirse a Certamen
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Estadísticas - Organizadas en pares para mobile -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="stat-card">
                <div class="text-2xl md:text-3xl mb-2">🎵</div>
                <div class="text-xl md:text-2xl font-bold text-white" id="songsCount">0</div>
                <div class="text-xs md:text-sm text-gray-400">Canciones</div>
            </div>
            <div class="stat-card">
                <div class="text-2xl md:text-3xl mb-2">👥</div>
                <div class="text-xl md:text-2xl font-bold text-white" id="followersCount">0</div>
                <div class="text-xs md:text-sm text-gray-400">Seguidores</div>
            </div>
            <div class="stat-card">
                <div class="text-2xl md:text-3xl mb-2">🏆</div>
                <div class="text-xl md:text-2xl font-bold text-white" id="certamenCount">0</div>
                <div class="text-xs md:text-sm text-gray-400">Certámenes</div>
            </div>
            <div class="stat-card">
                <div class="text-2xl md:text-3xl mb-2">⭐</div>
                <div class="text-xl md:text-2xl font-bold text-white" id="votesCount">0</div>
                <div class="text-xs md:text-sm text-gray-400">Votos</div>
            </div>
        </div>

        <!-- Certámenes Disponibles -->
        <div class="profile-card">
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center">
                <i class="fas fa-trophy text-yellow-400 mr-3"></i>
                Certámenes Disponibles
            </h2>
            
            <div id="certamenes-disponibles" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Certámenes se cargan aquí -->
            </div>
        </div>
    </div>

    <!-- Notificaciones -->
    <div id="notification" class="fixed top-4 right-4 z-50 hidden">
        <!-- Notificaciones dinámicas -->
    </div>

    <script>
        console.log('🚀 Iniciando perfil simple...');

        // Variables globales simples
        let artistaData = {};
        let tempPhotoData = null;

        // Cargar datos inmediatamente
        function cargarDatos() {
            console.log('📋 Cargando datos del localStorage...');
            
            try {
                const datos = localStorage.getItem('artistaLogueado');
                console.log('📊 Datos raw:', datos);
                
                if (datos) {
                    artistaData = JSON.parse(datos);
                    console.log('✅ Datos parseados:', artistaData);
                    
                    // Mostrar datos en la interfaz
                    document.getElementById('artistName').textContent = artistaData.nombre_artista || 'Nombre Artístico';
                    document.getElementById('realName').textContent = `${artistaData.nombre || ''} ${artistaData.apellido || ''}`.trim() || 'Nombre Real';
                    document.getElementById('musicGenre').textContent = artistaData.genero || 'No especificado';
                    
                    // Ubicación
                    let ubicacion = '';
                    if (artistaData.ciudad && artistaData.provincia) {
                        ubicacion = `${artistaData.ciudad}, ${artistaData.provincia}`;
                    } else if (artistaData.ciudad) {
                        ubicacion = artistaData.ciudad;
                    } else if (artistaData.provincia) {
                        ubicacion = artistaData.provincia;
                    } else {
                        ubicacion = 'No especificado';
                    }
                    document.getElementById('cityName').textContent = ubicacion;
                    
                    document.getElementById('phoneNumber').textContent = artistaData.whatsapp || 'No especificado';
                    
                    console.log('✅ Datos cargados en la interfaz');
                } else {
                    console.warn('⚠️ No hay datos en localStorage');
                    mostrarMensajeSinDatos();
                }
            } catch (error) {
                console.error('❌ Error al cargar datos:', error);
                mostrarMensajeSinDatos();
            }
        }

        function mostrarMensajeSinDatos() {
            document.getElementById('artistName').textContent = 'Datos no encontrados';
            document.getElementById('realName').textContent = 'Por favor, regístrate nuevamente';
        }

        // Cargar foto de perfil
        function cargarFoto() {
            console.log('🖼️ Cargando foto...');
            
            const savedPhoto = localStorage.getItem('profilePhotoVYT');
            const profilePhoto = document.getElementById('profilePhoto');
            const defaultAvatar = document.getElementById('defaultAvatar');
            
            if (savedPhoto && profilePhoto) {
                console.log('✅ Foto encontrada, mostrando...');
                profilePhoto.src = savedPhoto;
                profilePhoto.classList.remove('hidden');
                if (defaultAvatar) defaultAvatar.classList.add('hidden');
            } else {
                console.log('ℹ️ No hay foto guardada');
                profilePhoto.classList.add('hidden');
                if (defaultAvatar) defaultAvatar.classList.remove('hidden');
            }
        }

        // Cargar certámenes (datos de ejemplo)
        function cargarCertamenes() {
            console.log('🏆 Cargando certámenes...');
            
            const container = document.getElementById('certamenes-disponibles');
            
            const certamenes = [
                {
                    id: 'certamen-rosario-2025',
                    nombre: 'Certamen Rosario 2025',
                    descripcion: 'El certamen de canto más importante de Rosario',
                    premio: '$50,000',
                    inscripciones: 45,
                    maxInscripciones: 100,
                    diasRestantes: 18
                },
                {
                    id: 'certamen-nacional-2025',
                    nombre: 'Certamen Nacional 2025',
                    descripcion: 'Competencia a nivel nacional',
                    premio: '$200,000',
                    inscripciones: 12,
                    maxInscripciones: 500,
                    diasRestantes: 65
                },
                {
                    id: 'certamen-santa-fe-2025',
                    nombre: 'Certamen Santa Fe 2025',
                    descripcion: 'Para artistas de la provincia',
                    premio: '$75,000',
                    inscripciones: 23,
                    maxInscripciones: 200,
                    diasRestantes: 34
                }
            ];

            container.innerHTML = certamenes.map(certamen => {
                const porcentaje = (certamen.inscripciones / certamen.maxInscripciones) * 100;
                
                return `
                    <div class="certamen-card" onclick="irACertamen('${certamen.id}')">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex-1">
                                <h3 class="text-lg font-bold text-white mb-1">${certamen.nombre}</h3>
                                <p class="text-gray-300 text-sm">${certamen.descripcion}</p>
                            </div>
                            <div class="text-center">
                                <div class="bg-yellow-500 text-black text-xs font-bold px-2 py-1 rounded">
                                    🏆
                                </div>
                            </div>
                        </div>
                        
                        <div class="space-y-3">
                            <div class="flex justify-between text-sm">
                                <span class="text-gray-300">Premio:</span>
                                <span class="text-green-400 font-bold">${certamen.premio}</span>
                            </div>
                            
                            <div class="flex justify-between text-sm">
                                <span class="text-gray-300">Cierra en:</span>
                                <span class="text-blue-400 font-bold">${certamen.diasRestantes} días</span>
                            </div>
                            
                            <div class="space-y-2">
                                <div class="flex justify-between text-sm">
                                    <span class="text-gray-300">Inscripciones:</span>
                                    <span class="text-white">${certamen.inscripciones}/${certamen.maxInscripciones}</span>
                                </div>
                                <div class="w-full bg-gray-700 rounded-full h-2">
                                    <div class="bg-blue-500 h-2 rounded-full transition-all duration-300" 
                                         style="width: ${porcentaje}%"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4 pt-4 border-t border-white/10">
                            <button class="w-full bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-700 hover:to-blue-900 text-white font-bold py-2 px-4 rounded-lg transition-all duration-300 transform hover:scale-105">
                                <i class="fas fa-paper-plane mr-2"></i>
                                ¡Súmate al certamen!
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Funciones de interacción
        function changePhoto() {
            const input = document.getElementById('photoInput');
            input.click();
        }

        function savePhoto() {
            if (!tempPhotoData) {
                mostrarNotificacion('No hay foto para guardar', 'error');
                return;
            }

            localStorage.setItem('profilePhotoVYT', tempPhotoData);
            document.getElementById('savePhotoBtn').classList.add('hidden');
            tempPhotoData = null;
            mostrarNotificacion('¡Foto guardada correctamente!', 'success');
        }

        function irACertamen(certamenId) {
            window.location.href = `certamen-individual.html?id=${certamenId}`;
        }

        function editProfile() {
            mostrarNotificacion('Función de edición en desarrollo', 'info');
        }

        function viewCertamenes() {
            document.getElementById('certamenes-disponibles').scrollIntoView({ behavior: 'smooth' });
        }

        function logout() {
            if (confirm('¿Seguro que quieres cerrar sesión?')) {
                localStorage.removeItem('artistaLogueado');
                localStorage.removeItem('profilePhotoVYT');
                window.location.href = 'principal.html';
            }
        }

        function mostrarNotificacion(mensaje, tipo = 'info') {
            // Usar el sistema de notificaciones global
            if (window.notificationSystem) {
                window.notificationSystem.showToast(mensaje, tipo);
            } else {
                // Fallback al sistema anterior
                const notification = document.getElementById('notification');
                const colores = {
                    success: 'bg-green-500',
                    error: 'bg-red-500',
                    info: 'bg-blue-500'
                };

                const iconos = {
                    success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            notification.innerHTML = `
                <div class="${colores[tipo]} text-white p-4 rounded-lg shadow-lg flex items-center space-x-2">
                    <i class="fas ${iconos[tipo]}"></i>
                    <span>${mensaje}</span>
                </div>
            `;

            notification.classList.remove('hidden');
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 3000);
        }

        // Event listeners
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                console.log('📁 Archivo seleccionado:', file.name);

                const reader = new FileReader();
                reader.onload = function(e) {
                    tempPhotoData = e.target.result;
                    
                    const profilePhoto = document.getElementById('profilePhoto');
                    const defaultAvatar = document.getElementById('defaultAvatar');
                    
                    profilePhoto.src = tempPhotoData;
                    profilePhoto.classList.remove('hidden');
                    defaultAvatar.classList.add('hidden');
                    
                    document.getElementById('savePhotoBtn').classList.remove('hidden');
                    mostrarNotificacion('Foto cargada. Haz clic en "Guardar" para confirmar.', 'info');
                };
                reader.readAsDataURL(file);
            }
        });

        // Inicialización inmediata al cargar la página
        console.log('🔄 Iniciando carga automática...');
        cargarDatos();
        cargarFoto();
        cargarCertamenes();
        console.log('✅ Perfil cargado completamente');
    </script>
</body>
</html>
