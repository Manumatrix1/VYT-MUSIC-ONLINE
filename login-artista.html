<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYT MUSIC - Acceso de Artista</title>
    
    <!-- Design Tokens - Sistema Unificado -->
    <link rel="stylesheet" href="/design-tokens.css">
    
    <!-- Google Analytics 4 - Descomentar y configurar ID -->
    <!-- <script src="/src/google-analytics.js"></script> -->
    <!-- <script src="/src/recaptcha.js"></script> -->
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    body {
        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 30%, #1d4ed8 70%, #2563eb 100%);
        font-family: 'Montserrat', sans-serif;
        color: white;
        min-height: 100vh;
    }
    
    /* Clase para fondo dinmico que sobreescribe el fondo por defecto */
    body.dynamic-background {
        background: var(--dynamic-bg) !important;
        background-size: cover !important;
        background-attachment: fixed !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
    }
    
    .form-input {
        background-color: rgba(255, 255, 255, 0.9);
        border: 2px solid rgba(59, 130, 246, 0.3);
        transition: all 0.3s ease;
        color: #1f2937;
    }
    .form-input:focus {
        background-color: rgba(255, 255, 255, 0.95);
        border-color: #3b82f6;
        outline: none;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        font-weight: bold;
        padding: 0.75rem 2rem;
        border-radius: 0.5rem;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
    }
    .btn-primary:hover {
        background: linear-gradient(135deg, #059669, #047857);
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    }
    
    .loading-spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 3px solid #ffffff;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-black/20 backdrop-blur-sm p-4">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-white hover:text-blue-200 transition-colors">
                    <i class="fas fa-arrow-left text-xl"></i>
                </a>
                <img src="https://i.ibb.co/Ldwq7cNx/logo-blanco.png" alt="VYT MUSIC Logo" class="w-8 h-8">
                <h1 class="text-2xl font-bold" style="font-family: 'Bebas Neue', sans-serif;">
                    VYT MUSIC ARTISTA
                </h1>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <div class="container mx-auto px-4 py-8 flex items-center justify-center min-h-screen">
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-green-500 to-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-microphone text-3xl text-white"></i>
                </div>
                <h2 class="text-3xl font-bold mb-2">Acceso de Artista</h2>
                <p class="text-blue-100">Ingresa con tu cuenta de artista registrada</p>
            </div>

            <!-- Formulario de Login -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Correo Electrnico</label>
                    <input type="email" id="email" required class="form-input w-full p-3 rounded-lg" placeholder="tu@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Contrasea</label>
                    <div class="relative">
                        <input type="password" id="password" required class="form-input w-full p-3 rounded-lg pr-12" placeholder="Tu contrasea">
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Mensaje de error -->
                <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/50 text-red-200 p-3 rounded-lg text-center">
                </div>

                <!-- Mensaje de xito -->
                <div id="successMessage" class="hidden bg-green-500/20 border border-green-500/50 text-green-200 p-3 rounded-lg text-center">
                </div>

                <!-- Botn de Login -->
                <button type="submit" class="btn-primary w-full py-4 text-lg flex items-center justify-center space-x-2" id="loginBtn">
                    <span id="loginText">Ingresar a mi Perfil</span>
                    <div id="loginSpinner" class="loading-spinner hidden"></div>
                </button>
            </form>

            <!-- Enlaces adicionales -->
            <div class="text-center mt-6 space-y-3">
                <a href="#" onclick="showForgotPassword()" class="text-blue-200 hover:text-blue-100 text-sm">
                    Olvidaste tu contrasea?
                </a>
                <div class="border-t border-white/20 pt-4">
                    <p class="text-sm text-blue-100 mb-3">An no eres artista?</p>
                    <a href="crear-perfil-artista.html" class="bg-blue-600/50 hover:bg-blue-600/70 text-white px-6 py-2 rounded-lg transition-colors">
                        Registrarme como Artista
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Reset de Contrasea -->
    <div id="resetModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-6 max-w-md mx-4">
            <h3 class="text-xl font-bold mb-4">Recuperar Contrasea</h3>
            <p class="text-blue-100 mb-4">Ingresa tu correo y te enviaremos un link para restablecer tu contrasea</p>
            <form id="resetForm">
                <input type="email" id="resetEmail" required class="form-input w-full p-3 rounded-lg mb-4" placeholder="tu@email.com">
                <div class="flex space-x-3">
                    <button type="submit" class="btn-primary flex-1">Enviar</button>
                    <button type="button" onclick="hideResetModal()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase y JavaScript -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        // Configuracin Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB_LRm2DUhQXwlaCFGc4pqzWs6OiMdRqlk",
            authDomain: "vytonlineprueva.firebaseapp.com",
            projectId: "vytonlineprueva",
            storageBucket: "vytonlineprueva.firebasestorage.app",
            messagingSenderId: "175483939728",
            appId: "1:175483939728:web:230294acca9221d1d1a115",
            measurementId: "G-PWRTMBH631"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elementos DOM
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');
        const resetModal = document.getElementById('resetModal');
        const resetForm = document.getElementById('resetForm');
        const resetEmail = document.getElementById('resetEmail');

        // Funcin para mostrar errores
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 5000);
        }

        // Funcin para mostrar xito
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        // Funcin para mostrar loading
        function setLoading(loading) {
            if (loading) {
                loginText.textContent = 'Verificando...';
                loginSpinner.classList.remove('hidden');
                loginBtn.disabled = true;
            } else {
                loginText.textContent = 'Ingresar a mi Perfil';
                loginSpinner.classList.add('hidden');
                loginBtn.disabled = false;
            }
        }

        // Login de artista
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                showError('Por favor, completa todos los campos');
                return;
            }

            setLoading(true);

            try {
                // Autenticar usuario
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Verificar si es un artista registrado
                const userDocRef = doc(db, 'users', user.uid);
                
                try {
                    const userDoc = await getDoc(userDocRef);
                    
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        
                        // Guardar datos en localStorage para el perfil
                        localStorage.setItem('artistaLogueado', JSON.stringify({
                            uid: user.uid,
                            email: user.email,
                            ...userData
                        }));

                        showSuccess('Bienvenido/a de vuelta! Redirigiendo...');
                        
                        // Redireccionar al perfil del artista
                        setTimeout(() => {
                            window.location.href = 'perfil-artista.html';
                        }, 1500);
                    } else {
                        // Usuario autenticado pero sin perfil completo
                        localStorage.setItem('artistaLogueado', JSON.stringify({
                            uid: user.uid,
                            email: user.email,
                            emailVerified: user.emailVerified
                        }));
                        
                        showSuccess('Cuenta encontrada. Redirigiendo al perfil...');
                        setTimeout(() => {
                            window.location.href = 'perfil-artista.html';
                        }, 1500);
                    }
                } catch (firestoreError) {
                    console.warn('Error accediendo a Firestore, pero login exitoso:', firestoreError);
                    
                    // Login exitoso en Auth, continuar aunque Firestore falle
                    localStorage.setItem('artistaLogueado', JSON.stringify({
                        uid: user.uid,
                        email: user.email,
                        emailVerified: user.emailVerified
                    }));
                    
                    showSuccess('Acceso exitoso! Redirigiendo...');
                    setTimeout(() => {
                        window.location.href = 'perfil-artista.html';
                    }, 1500);
                }

            } catch (error) {
                console.error('Error en login:', error);
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        showError('No existe una cuenta con este correo electrnico');
                        break;
                    case 'auth/wrong-password':
                        showError('Contrasea incorrecta');
                        break;
                    case 'auth/invalid-email':
                        showError('El correo electrnico no es vlido');
                        break;
                    case 'auth/too-many-requests':
                        showError('Demasiados intentos fallidos. Intenta ms tarde');
                        break;
                    default:
                        showError('Error al iniciar sesin. Verifica tus credenciales');
                }
            } finally {
                setLoading(false);
            }
        });

        // Reset de contrasea
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = resetEmail.value.trim();
            
            if (!email) {
                showError('Ingresa tu correo electrnico');
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Correo de recuperacin enviado. Revisa tu bandeja de entrada.');
                hideResetModal();
            } catch (error) {
                showError('Error al enviar correo de recuperacin');
            }
        });

        // Funciones globales
        window.togglePassword = function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            document.getElementById('toggleIcon').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        };

        window.showForgotPassword = function() {
            resetModal.classList.remove('hidden');
        };

        window.hideResetModal = function() {
            resetModal.classList.add('hidden');
            resetEmail.value = '';
        };

        // Sistema de fondos dinmicos desde Admin
        function loadDynamicBackground() {
            try {
                const backgroundConfig = JSON.parse(localStorage.getItem('backgroundConfig') || '{}');
                const currentPage = 'login-artista.html';
                
                console.log(' Verificando configuracin de fondo para:', currentPage);
                console.log(' Configuracin completa:', backgroundConfig);
                
                if (backgroundConfig[currentPage] && backgroundConfig[currentPage].imageData) {
                    console.log(' Aplicando fondo personalizado para login-artista.html');
                    
                    const config = backgroundConfig[currentPage];
                    const position = config.position || 'center center';
                    const scale = config.scale || 1;
                    const backgroundSize = scale > 1 ? `${scale * 100}%` : 'cover';
                    
                    console.log(` Posicin: ${position}, Escala: ${scale}`);
                    
                    // Mtodo 1: Usar variable CSS y clase
                    document.documentElement.style.setProperty('--dynamic-bg', 
                        `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('${config.imageData}')`);
                    document.body.classList.add('dynamic-background');
                    
                    // Mtodo 2: Aplicar directamente con !important como backup
                    setTimeout(() => {
                        document.body.style.setProperty('background', 
                            `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('${config.imageData}')`, 'important');
                        document.body.style.setProperty('background-size', backgroundSize, 'important');
                        document.body.style.setProperty('background-attachment', 'fixed', 'important');
                        document.body.style.setProperty('background-position', position, 'important');
                        document.body.style.setProperty('background-repeat', 'no-repeat', 'important');
                        
                        console.log(' Fondo aplicado exitosamente');
                    }, 100);
                    
                    console.log(` Fondo personalizado aplicado con posicin: ${position} y escala: ${scale}`);
                } else {
                    console.log(' No hay fondo personalizado configurado para esta pgina');
                    console.log(' Para configurar un fondo, ve al admin y sube una imagen para login-artista.html');
                }
            } catch (error) {
                console.error(' Error cargando fondo personalizado:', error);
            }
        }

        // Cargar fondo dinmico al cargar la pgina
        document.addEventListener('DOMContentLoaded', function() {
            loadDynamicBackground();
        });

        // Tambin cargar si la pgina ya est cargada
        if (document.readyState === 'complete') {
            loadDynamicBackground();
        }
    </script>
</body>
</html>
