<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacer Admin - VYT Music Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
        }
        button:hover { background: #3367d6; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success { background: #e8f5e8; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
        .step { margin: 15px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 Convertir en Administrador</h1>
        
        <div class="step">
            <h3>Paso 1: Inicia sesión con tu cuenta</h3>
            <button onclick="loginUser()">🔑 Iniciar Sesión</button>
        </div>
        
        <div class="step">
            <h3>Paso 2: Convertir en Admin</h3>
            <button onclick="makeUserAdmin()" id="adminBtn" disabled>👑 Hacerme Administrador</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        function showResult(message, type = 'success') {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.textContent = message;
        }

        // Monitorear estado de autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                showResult(`✅ Usuario conectado: ${user.email}`, 'success');
                document.getElementById('adminBtn').disabled = false;
            } else {
                showResult('❌ No hay usuario conectado', 'error');
                document.getElementById('adminBtn').disabled = true;
            }
        });

        window.loginUser = async function() {
            const email = 'luciano21martinez@gmail.com';
            const password = prompt('Ingresa tu contraseña:');
            
            if (!password) {
                showResult('❌ Contraseña requerida', 'error');
                return;
            }
            
            try {
                showResult('🔑 Iniciando sesión...', 'success');
                await signInWithEmailAndPassword(auth, email, password);
                showResult(`✅ Sesión iniciada como: ${email}`, 'success');
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ Error iniciando sesión: ${error.message}`, 'error');
            }
        };

        window.makeUserAdmin = async function() {
            const user = auth.currentUser;
            if (!user) {
                showResult('❌ Primero debes iniciar sesión', 'error');
                return;
            }
            
            try {
                showResult('👑 Configurando como administrador...', 'success');
                
                // Crear/actualizar perfil en Firestore
                await setDoc(doc(db, 'users', user.uid), {
                    email: user.email,
                    displayName: user.displayName || 'Luciano Martinez',
                    role: 'admin',
                    created_at: serverTimestamp(),
                    updated_at: serverTimestamp(),
                    vyt_money_balance: 0,
                    total_votes: 0,
                    status: 'active'
                });

                showResult(`🎉 ¡ÉXITO! Usuario configurado como administrador

Email: ${user.email}
UID: ${user.uid}
Rol: Admin

Ya puedes acceder al panel de administración.`, 'success');
                
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ Error configurando admin: ${error.message}`, 'error');
            }
        };

        console.log('🚀 Página de configuración admin lista!');
    </script>
</body>
</html>
