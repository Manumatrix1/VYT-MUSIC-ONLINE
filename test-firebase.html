<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Firebase Connection</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full p-6 bg-gray-800 rounded-lg">
        <h1 class="text-2xl font-bold mb-4">Test Firebase Connection</h1>
        
        <div id="connection-status" class="mb-4">
            <p>Estado: <span id="status">Verificando...</span></p>
        </div>
        
        <div class="mb-4">
            <h3 class="font-semibold mb-2">Crear Usuario Admin:</h3>
            <input type="email" id="admin-email" placeholder="Email admin" class="w-full p-2 mb-2 bg-gray-700 rounded">
            <input type="password" id="admin-password" placeholder="Contraseña admin" class="w-full p-2 mb-2 bg-gray-700 rounded">
            <button id="create-admin" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Crear Admin</button>
        </div>
        
        <div class="mb-4">
            <h3 class="font-semibold mb-2">Test Login:</h3>
            <input type="email" id="test-email" placeholder="Email" class="w-full p-2 mb-2 bg-gray-700 rounded">
            <input type="password" id="test-password" placeholder="Contraseña" class="w-full p-2 mb-2 bg-gray-700 rounded">
            <button id="test-login" class="bg-green-600 text-white px-4 py-2 rounded w-full">Test Login</button>
        </div>
        
        <div id="result" class="text-sm"></div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');
        const createAdminBtn = document.getElementById('create-admin');
        const testLoginBtn = document.getElementById('test-login');

        // Test Firebase connection
        onAuthStateChanged(auth, (user) => {
            if (user) {
                statusEl.textContent = `Conectado como: ${user.email}`;
                statusEl.className = 'text-green-400';
            } else {
                statusEl.textContent = 'No autenticado - Firebase OK';
                statusEl.className = 'text-yellow-400';
            }
        });

        // Create admin user
        createAdminBtn.addEventListener('click', async () => {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            
            if (!email || !password) {
                resultEl.innerHTML = '<p class="text-red-400">Por favor completa email y contraseña</p>';
                return;
            }
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Set admin role in Firestore
                await setDoc(doc(db, "admin_users", user.uid), {
                    email: user.email,
                    role: "admin",
                    createdAt: new Date()
                });
                
                resultEl.innerHTML = `<p class="text-green-400">Admin creado exitosamente: ${user.email}</p>`;
            } catch (error) {
                resultEl.innerHTML = `<p class="text-red-400">Error creando admin: ${error.message}</p>`;
                console.error(error);
            }
        });

        // Test login
        testLoginBtn.addEventListener('click', async () => {
            const email = document.getElementById('test-email').value;
            const password = document.getElementById('test-password').value;
            
            if (!email || !password) {
                resultEl.innerHTML = '<p class="text-red-400">Por favor completa email y contraseña</p>';
                return;
            }
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                resultEl.innerHTML = `<p class="text-green-400">Login exitoso: ${user.email}</p>`;
            } catch (error) {
                resultEl.innerHTML = `<p class="text-red-400">Error en login: ${error.message}</p>`;
                console.error(error);
            }
        });
    </script>
</body>
</html>
