<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Rechazado - VYT MUSIC</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            font-family: 'Roboto', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        .error-icon {
            width: 100px;
            height: 100px;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 0 auto 30px;
            color: #ef4444;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            color: #ef4444;
        }

        p {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .info-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            color: #fca5a5;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #3B82F6, #2DD4BF);
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-times"></i>
        </div>

        <h1>Pago Rechazado</h1>
        <p>No pudimos procesar tu pago. Por favor intenta nuevamente.</p>

        <div class="info-box">
            <strong>Posibles causas:</strong>
            <ul style="text-align: left; margin-top: 10px;">
                <li>• Fondos insuficientes</li>
                <li>• Datos incorrectos de la tarjeta</li>
                <li>• Bloqueo de transacción por tu banco</li>
            </ul>
        </div>

        <p style="color: #fbbf24; font-size: 0.95rem;">
            <i class="fas fa-clock"></i> Recuerda: Tienes 48 horas para completar el pago.
        </p>

        <button class="btn" onclick="window.history.back()">
            Intentar Nuevamente
        </button>
    </div>
</body>
</html>
