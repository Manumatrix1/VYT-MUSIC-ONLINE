<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso! - VYT MUSIC</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Tu pago fue procesado exitosamente">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VYT Music">
    <link rel="apple-touch-icon" href="/images/icons/icon-192x192.png">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-fondo-secundario: #161b22;
            --color-texto-principal: #e6edf3;
            --color-texto-secundario: #b0b8c4;
            --color-primario: #58a6ff;
            --color-secundario: #238636;
            --color-oro: #FFD700;
            --fuente-titulos: 'Bebas Neue', sans-serif;
            --fuente-cuerpo: 'Montserrat', sans-serif;
        }
        body {
            background-color: #121212;
            font-family: var(--fuente-cuerpo);
            color: var(--color-texto-principal);
        }
        .modal-content {
            background: var(--color-fondo-secundario);
            padding: 2.5rem;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #30363d;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            margin: auto;
        }
        .modal-title {
            font-family: var(--fuente-titulos);
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .modal-text {
            margin-bottom: 1.5rem;
            color: var(--color-texto-secundario);
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .btn-primario {
            background-color: var(--color-primario);
            color: #121212;
        }
        .btn-primario:hover {
            background-color: transparent;
            border-color: var(--color-primario);
            color: var(--color-primario);
        }
        .btn-secundario {
            background-color: transparent;
            color: var(--color-texto-principal);
            border-color: #8b949e;
        }
        .btn-secundario:hover {
            border-color: var(--color-texto-principal);
            color: var(--color-texto-principal);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">
    <main class="container py-10">
        <div class="modal-content">
            <h2 class="modal-title" style="color: var(--color-secundario);">✅ ¡Pago Confirmado!</h2>
            <div id="certamen-info" class="mb-6 p-4 bg-gray-800 rounded-lg">
                <h3 class="text-lg font-semibold mb-2">Inscripción Confirmada</h3>
                <p id="certamen-nombre" class="text-gray-300"></p>
                <p id="monto-pagado" class="text-green-400 font-bold"></p>
            </div>
            <p class="modal-text">
                ¡Gracias por completar tu inscripción! Tu pago ha sido procesado con éxito.
                <br>
                Ya eres parte oficial del certamen y tu video será evaluado por nuestro equipo.
                <br>
                Te hemos enviado un correo electrónico con los siguientes pasos.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center mt-6">
                <a href="../principal.html" class="btn btn-primario">🏠 Ir a Principal</a>
                <a href="../certamenes.html" class="btn btn-secundario">Ver Ranking</a>
            </div>
        </div>
    </main>
    
    <script type="module">
        import { db } from '../firebase-config.js';
        import { doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const inscripcionRef = urlParams.get('ref');
            const precio = urlParams.get('precio');
            const certamen = urlParams.get('certamen');

            // Mostrar información del certamen
            if (certamen) {
                document.getElementById('certamen-nombre').textContent = `Certamen: ${decodeURIComponent(certamen)}`;
            }
            if (precio) {
                document.getElementById('monto-pagado').textContent = `Monto: $${precio}`;
            }

            // Mostrar notificación de éxito si hay sistema de notificaciones
            if (window.notifications) {
                const tipoTexto = tipo === 'vyt_money' ? 'VYT-MONEY' : 'Inscripción';
                window.notifications.paymentSuccess(precio, tipo);
            }

            // Actualizar el estado de pago en Firebase
            if (inscripcionRef) {
                try {
                    await updateDoc(doc(db, "participantes_online", inscripcionRef), {
                        pago_completado: true,
                        fecha_pago: new Date()
                    });
                    console.log("Pago confirmado en Firebase");
                } catch (error) {
                    console.error("Error updating payment status:", error);
                }
            }
        });
    </script>
</body>
</html>
