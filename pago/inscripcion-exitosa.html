<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso! - VYT MUSIC</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Tu pago fue procesado exitosamente">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VYT Music">
    <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png?v=1767433485">
    <link rel="manifest" href="/manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../firebase-config.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            font-family: 'Roboto', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #34d399, #10b981);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 0 auto 30px;
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            color: #34d399;
        }

        p {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .details {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #94a3b8;
        }

        .detail-value {
            font-weight: 600;
            color: #34d399;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #3B82F6, #2DD4BF);
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #60a5fa;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <h1>¡Pago Exitoso!</h1>
        <p>Tu inscripción ha sido confirmada. Ya estás participando en el certamen.</p>

        <div class="details">
            <div class="detail-item">
                <span class="detail-label">Estado</span>
                <span class="detail-value">✓ Participando</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Monto Pagado</span>
                <span class="detail-value">$15,000 ARS</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Al Pozo</span>
                <span class="detail-value">$4,500</span>
            </div>
        </div>

        <p style="color: #86efac; background: rgba(34, 197, 94, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 30px;">
            <i class="fas fa-lightbulb"></i> <strong>Próximo paso:</strong> Comparte tu perfil en redes sociales para conseguir votos y subir en el ranking.
        </p>

        <button class="btn" onclick="window.location.href='../ranking.html'">
            Ver Ranking
        </button>
        <button class="btn btn-secondary" onclick="window.location.href='../perfil-artista.html'">
            Mi Perfil
        </button>
    </div>
</body>
</html>
