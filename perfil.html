<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYT MUSIC - Mi Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            font-family: 'Roboto', sans-serif;
            color: white;
            overflow-x: hidden;
        }
        .font-display { font-family: 'Montserrat', sans-serif; }
        .profile-card {
            background-color: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2bb7d1;
        }
        .contest-entry-card {
            background-color: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 0.5rem;
            padding: 1rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-black/50 backdrop-blur-sm p-4 flex items-center justify-between shadow-lg sticky top-0 z-50">
        <div class="flex items-center space-x-4">
            <button onclick="window.history.back()" class="bg-gray-800 hover:bg-gray-700 text-white p-2 rounded-full transition-all duration-300 shadow-lg mr-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <img src="https://i.ibb.co/Ldwq7cNx/logo-blanco.png" alt="Logo VYT Music" class="w-28">
        </div>
        <nav class="flex items-center space-x-4 text-sm">
            <a href="principal.html" class="text-gray-300 hover:text-white px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-all">
                🏠 Volver a Principal
            </a>
        </nav>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-3xl space-y-8">
            <div class="text-center mb-10">
                <h1 class="font-display text-4xl md:text-5xl font-black">Mi Perfil de Artista</h1>
                <p class="text-gray-400 mt-2">Gestiona tu información y tus participaciones en los certámenes.</p>
            </div>
            
            <div id="profile-section" class="profile-card flex flex-col md:flex-row items-center md:items-start space-y-6 md:space-y-0 md:space-x-8">
                <img id="profile-avatar" src="https://placehold.co/120x120/282828/ffffff?text=Avatar" alt="Avatar del Artista" class="profile-avatar">
                <div class="text-center md:text-left">
                    <h2 id="profile-name" class="font-display text-3xl font-bold">Cargando...</h2>
                    <p id="profile-email" class="text-gray-400 text-lg">Cargando...</p>
                    <p id="profile-slogan" class="text-gray-300 italic mt-2">Cargando frase...</p>
                    <button id="logout-button" class="mt-4 px-4 py-2 bg-red-600 text-white rounded-full hover:bg-red-700 transition-colors duration-200">Cerrar Sesión</button>
                </div>
            </div>

            <div id="contest-entries-section" class="space-y-4">
                <h3 class="font-display text-2xl font-bold text-gray-200">Mis Inscripciones</h3>
                <div id="contest-entries-list" class="space-y-4">
                    <p class="text-gray-400">Cargando inscripciones...</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { db } from './firebase-config.js';
        import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const auth = getAuth();

        const profileAvatar = document.getElementById('profile-avatar');
        const profileName = document.getElementById('profile-name');
        const profileEmail = document.getElementById('profile-email');
        const profileSlogan = document.getElementById('profile-slogan');
        const logoutButton = document.getElementById('logout-button');
        const contestEntriesList = document.getElementById('contest-entries-list');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is signed in
                profileEmail.textContent = user.email;

                // Fetch user data from Firestore
                const userDocRef = doc(db, "artistas", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    profileName.textContent = userData.nombre_artista || 'Artista sin nombre';
                    profileSlogan.textContent = userData.frase_identificativa || 'Sin frase identificativa';
                    if (userData.foto_url) {
                        profileAvatar.src = userData.foto_url;
                    }
                } else {
                    profileName.textContent = 'Artista Nuevo';
                    profileSlogan.textContent = 'Completa tu perfil!';
                }

                // Fetch contest entries
                contestEntriesList.innerHTML = '<p class="text-gray-400">Cargando inscripciones...</p>';
                try {
                    const onlineQuery = query(collection(db, "participantes_online"), where("uid", "==", user.uid));
                    const presencialQuery = query(collection(db, "participantes_presenciales"), where("uid", "==", user.uid));

                    const onlineSnapshot = await getDocs(onlineQuery);
                    const presencialSnapshot = await getDocs(presencialQuery);

                    let entriesHtml = '';
                    if (onlineSnapshot.empty && presencialSnapshot.empty) {
                        entriesHtml = '<p class="text-gray-500">Aún no tienes inscripciones a certámenes.</p>';
                    } else {
                        onlineSnapshot.forEach((doc) => {
                            const data = doc.data();
                            entriesHtml += `
                                <div class="contest-entry-card">
                                    <h4 class="font-bold text-lg">Inscripción Online</h4>
                                    <p>Nombre Artístico: ${data.nombre_artista}</p>
                                    <p>Video: <a href="${data.video_link}" target="_blank" class="text-blue-400 hover:underline">Ver Video</a></p>
                                    <p>Estado: ${data.aprobado ? 'Aprobado' : 'Pendiente'}</p>
                                    <p>Tipo: ${data.tipo_inscripcion}</p>
                                </div>
                            `;
                        });
                        presencialSnapshot.forEach((doc) => {
                            const data = doc.data();
                            entriesHtml += `
                                <div class="contest-entry-card">
                                    <h4 class="font-bold text-lg">Inscripción Presencial</h4>
                                    <p>Nombre: ${data.nombre_artista}</p>
                                    <p>Edad: ${data.edad}</p>
                                    <p>Video: <a href="${data.video_link}" target="_blank" class="text-blue-400 hover:underline">Ver Video</a></p>
                                    <p>Estado: ${data.aprobado ? 'Aprobado' : 'Pendiente'}</p>
                                    <p>Tipo: ${data.tipo_inscripcion}</p>
                                </div>
                            `;
                        });
                    }
                    contestEntriesList.innerHTML = entriesHtml;

                } catch (error) {
                    console.error("Error fetching contest entries:", error);
                    contestEntriesList.innerHTML = '<p class="text-red-500">Error al cargar tus inscripciones.</p>';
                }

            } else {
                // User is signed out, redirect to login page
                window.location.href = 'login.html';
            }
        });

        logoutButton.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Error al cerrar sesión:", error);
                alert("Error al cerrar sesión. Por favor, inténtalo de nuevo.");
            }
        });
    </script>
    
    <!-- Sistema de navegación -->
    <link rel="stylesheet" href="/src/navigation-styles.css">
    <script src="/src/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new VYTNavigation();
        });
    </script>
</body>
</html>
