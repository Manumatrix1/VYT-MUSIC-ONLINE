<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYT Music - Mi Perfil</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Gestiona tu perfil en VYT Music">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png?v=1768337820">
    
    <!-- Design Tokens - Sistema Unificado -->
    <link rel="stylesheet" href="/design-tokens.css">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Mobile Fixes -->
    <link rel="stylesheet" href="/mobile-fixes.css">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="src/navigation-styles.css">
    
    <!-- Sistema de navegacin -->
    <script src="/src/navigation.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .profile-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
        }

        .profile-info h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 5px;
        }

        .profile-info p {
            color: #666;
            font-size: 16px;
        }

        .profile-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .section h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vote-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vote-info h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        .vote-info p {
            font-size: 13px;
            color: #999;
        }

        .vote-amount {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            color: #667eea;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }

        .logout-btn {
            background: #ff4757;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ff3838;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header con logo -->
    <div class="profile-container">
        <div style="text-align: center; padding: 20px 0;">
            <a href="index.html">
                <img src="https://i.ibb.co/Ldwq7cNx/logo-blanco.png" alt="VYT Music Logo" style="width: 80px; height: auto; filter: brightness(0) invert(1);">
            </a>
        </div>
        
        <div class="profile-header">
            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Usuario&background=667eea&color=fff&size=200" alt="Avatar" class="profile-avatar">
            <div class="profile-info">
                <h1 id="userName">Cargando...</h1>
                <p id="userEmail">Cargando...</p>
                <span class="profile-badge"><i class="fas fa-star"></i> Visitante</span>
                <br>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesin
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"></div>
                <div class="stat-value" id="vytMoneyBalance">0</div>
                <div class="stat-label">VYT Money</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon"></div>
                <div class="stat-value" id="totalVotes">0</div>
                <div class="stat-label">Votos Realizados</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon"></div>
                <div class="stat-value" id="artistsSupported">0</div>
                <div class="stat-label">Artistas Apoyados</div>
            </div>
        </div>

        <div class="section">
            <button class="btn-primary" onclick="window.location.href='comprar-vyt-money.html'">
                <i class="fas fa-coins"></i>
                Comprar VYT Money
            </button>
        </div>

        <div class="section">
            <h2>
                <i class="fas fa-heart"></i>
                Mis Votos Recientes
            </h2>
            <div id="votesList">
                <div class="empty-state">
                    <i class="fas fa-vote-yea"></i>
                    <p>An no has votado por ningn artista</p>
                    <br>
                    <button class="btn-secondary" onclick="window.location.href='certamenes.html'">
                        Ver Certmenes
                    </button>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>
                <i class="fas fa-trophy"></i>
                Certmenes que Sigues
            </h2>
            <div id="followedContests">
                <div class="empty-state">
                    <i class="fas fa-trophy"></i>
                    <p>No sigues ningn certamen an</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="src/auth-handler.js"></script>    <script src="/src/auth-guard.js"></script>
    <script src="/src/nav-global.js"></script>    <script src="src/navigation.js"></script>

    <script>
        // Esperar a que authHandler est listo
        function initProfile() {
            if (!window.authHandler || !window.authHandler.initialized) {
                setTimeout(initProfile, 100);
                return;
            }

            // Verificar autenticacin
            if (!window.authHandler.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }

            // Verificar que sea visitante
            if (window.authHandler.isArtista()) {
                window.location.href = 'perfil-artista.html';
                return;
            }

            loadUserData();
        }

        async function loadUserData() {
            const user = window.authHandler.user;

            // Actualizar informacin bsica
            document.getElementById('userName').textContent = user.displayName || 'Usuario';
            document.getElementById('userEmail').textContent = user.email;

            if (user.photoURL) {
                document.getElementById('userAvatar').src = user.photoURL;
            } else {
                document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'Usuario')}&background=667eea&color=fff&size=200`;
            }

            // Cargar balance de VYT Money
            try {
                const db = firebase.firestore();
                const moneyDoc = await db.collection('user_vyt_money').doc(user.uid).get();
                
                if (moneyDoc.exists) {
                    const balance = moneyDoc.data().balance || 0;
                    document.getElementById('vytMoneyBalance').textContent = balance.toLocaleString();
                }
            } catch (error) {
                console.error('Error cargando VYT Money:', error);
            }

            // Cargar votos (simulado por ahora)
            loadVotesHistory();
        }

        function loadVotesHistory() {
            // Por ahora mostrar mensaje vaco
            // En el futuro, consultar coleccin de votos
            console.log(' Cargando historial de votos...');
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            const confirmed = confirm('Seguro que quieres cerrar sesin?');
            if (confirmed) {
                await window.authHandler.logout();
                window.location.href = 'index.html';
            }
        });

        // Inicializar
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initProfile);
        } else {
            initProfile();
        }
    </script>
</body>
</html>
    </main>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { db } from './firebase-config.js';
        import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const auth = getAuth();

        const profileAvatar = document.getElementById('profile-avatar');
        const profileName = document.getElementById('profile-name');
        const profileEmail = document.getElementById('profile-email');
        const profileSlogan = document.getElementById('profile-slogan');
        const logoutButton = document.getElementById('logout-button');
        const contestEntriesList = document.getElementById('contest-entries-list');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is signed in
                profileEmail.textContent = user.email;

                // Fetch user data from Firestore
                const userDocRef = doc(db, "artistas", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    profileName.textContent = userData.nombre_artista || 'Artista sin nombre';
                    profileSlogan.textContent = userData.frase_identificativa || 'Sin frase identificativa';
                    if (userData.foto_url) {
                        profileAvatar.src = userData.foto_url;
                    }
                } else {
                    profileName.textContent = 'Artista Nuevo';
                    profileSlogan.textContent = 'Completa tu perfil!';
                }

                // Fetch contest entries
                contestEntriesList.innerHTML = '<p class="text-gray-400">Cargando inscripciones...</p>';
                try {
                    const onlineQuery = query(collection(db, "participantes_online"), where("uid", "==", user.uid));
                    const presencialQuery = query(collection(db, "participantes_presenciales"), where("uid", "==", user.uid));

                    const onlineSnapshot = await getDocs(onlineQuery);
                    const presencialSnapshot = await getDocs(presencialQuery);

                    let entriesHtml = '';
                    if (onlineSnapshot.empty && presencialSnapshot.empty) {
                        entriesHtml = '<p class="text-gray-500">An no tienes inscripciones a certmenes.</p>';
                    } else {
                        onlineSnapshot.forEach((doc) => {
                            const data = doc.data();
                            entriesHtml += `
                                <div class="contest-entry-card">
                                    <h4 class="font-bold text-lg">Inscripcin Online</h4>
                                    <p>Nombre Artstico: ${data.nombre_artista}</p>
                                    <p>Video: <a href="${data.video_link}" target="_blank" class="text-blue-400 hover:underline">Ver Video</a></p>
                                    <p>Estado: ${data.aprobado ? 'Aprobado' : 'Pendiente'}</p>
                                    <p>Tipo: ${data.tipo_inscripcion}</p>
                                </div>
                            `;
                        });
                        presencialSnapshot.forEach((doc) => {
                            const data = doc.data();
                            entriesHtml += `
                                <div class="contest-entry-card">
                                    <h4 class="font-bold text-lg">Inscripcin Presencial</h4>
                                    <p>Nombre: ${data.nombre_artista}</p>
                                    <p>Edad: ${data.edad}</p>
                                    <p>Video: <a href="${data.video_link}" target="_blank" class="text-blue-400 hover:underline">Ver Video</a></p>
                                    <p>Estado: ${data.aprobado ? 'Aprobado' : 'Pendiente'}</p>
                                    <p>Tipo: ${data.tipo_inscripcion}</p>
                                </div>
                            `;
                        });
                    }
                    contestEntriesList.innerHTML = entriesHtml;

                } catch (error) {
                    console.error("Error fetching contest entries:", error);
                    contestEntriesList.innerHTML = '<p class="text-red-500">Error al cargar tus inscripciones.</p>';
                }

            } else {
                // User is signed out, redirect to login page
                window.location.href = 'login.html';
            }
        });

        logoutButton.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Error al cerrar sesin:", error);
                alert("Error al cerrar sesin. Por favor, intntalo de nuevo.");
            }
        });
    </script>
    
    <!-- Sistema de navegacin -->
    <link rel="stylesheet" href="/src/navigation-styles.css">
    <script src="/src/navigation.js"></script>
    </body>
</html>
