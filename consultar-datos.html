<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Consultar Datos VYT MUSIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8">🔍 Consulta de Datos VYT MUSIC</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold text-lg mb-4">📊 Participantes Online</h3>
                <button onclick="consultarParticipantesOnline()" class="bg-blue-600 text-white px-4 py-2 rounded">
                    Consultar
                </button>
                <div id="participantes-online" class="mt-4"></div>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold text-lg mb-4">🎪 Participantes Presenciales</h3>
                <button onclick="consultarParticipantesPresenciales()" class="bg-green-600 text-white px-4 py-2 rounded">
                    Consultar
                </button>
                <div id="participantes-presenciales" class="mt-4"></div>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold text-lg mb-4">🎨 Perfiles de Artistas</h3>
                <button onclick="consultarPerfilesArtistas()" class="bg-purple-600 text-white px-4 py-2 rounded">
                    Consultar
                </button>
                <div id="perfiles-artistas" class="mt-4"></div>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold text-lg mb-4">👥 Usuarios</h3>
                <button onclick="consultarUsuarios()" class="bg-yellow-600 text-white px-4 py-2 rounded">
                    Consultar
                </button>
                <div id="usuarios" class="mt-4"></div>
            </div>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow mt-6">
            <h3 class="font-bold text-lg mb-4">🗂️ Todas las Colecciones</h3>
            <button onclick="listarTodasLasColecciones()" class="bg-red-600 text-white px-4 py-2 rounded">
                Listar Todas las Colecciones
            </button>
            <div id="todas-colecciones" class="mt-4"></div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        window.consultarParticipantesOnline = async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "participantes_online"));
                const container = document.getElementById('participantes-online');
                container.innerHTML = `<p class="font-bold">📊 Total: ${querySnapshot.size} participantes</p>`;
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    container.innerHTML += `
                        <div class="border p-2 mt-2 rounded">
                            <p><strong>ID:</strong> ${doc.id}</p>
                            <p><strong>Nombre:</strong> ${data.nombre} ${data.apellido}</p>
                            <p><strong>Email:</strong> ${data.email}</p>
                            <p><strong>Estado:</strong> ${data.estado || 'pendiente'}</p>
                            <p><strong>Fecha:</strong> ${data.createdAt?.toDate?.()?.toLocaleDateString() || 'N/A'}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('participantes-online').innerHTML = `<p class="text-red-600">Error: ${error.message}</p>`;
            }
        };

        window.consultarParticipantesPresenciales = async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "participantes_presenciales"));
                const container = document.getElementById('participantes-presenciales');
                container.innerHTML = `<p class="font-bold">🎪 Total: ${querySnapshot.size} participantes</p>`;
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    container.innerHTML += `
                        <div class="border p-2 mt-2 rounded">
                            <p><strong>ID:</strong> ${doc.id}</p>
                            <p><strong>Nombre:</strong> ${data.nombre} ${data.apellido}</p>
                            <p><strong>Email:</strong> ${data.email}</p>
                            <p><strong>Estado:</strong> ${data.estado || 'pendiente'}</p>
                            <p><strong>Fecha:</strong> ${data.createdAt?.toDate?.()?.toLocaleDateString() || 'N/A'}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('participantes-presenciales').innerHTML = `<p class="text-red-600">Error: ${error.message}</p>`;
            }
        };

        window.consultarPerfilesArtistas = async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "artist_profiles"));
                const container = document.getElementById('perfiles-artistas');
                container.innerHTML = `<p class="font-bold">🎨 Total: ${querySnapshot.size} perfiles</p>`;
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    container.innerHTML += `
                        <div class="border p-2 mt-2 rounded">
                            <p><strong>ID:</strong> ${doc.id}</p>
                            <p><strong>Nombre:</strong> ${data.nombre || data.name}</p>
                            <p><strong>Usuario:</strong> ${data.user_id}</p>
                            <p><strong>Estado:</strong> ${data.status || data.estado}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('perfiles-artistas').innerHTML = `<p class="text-red-600">Error: ${error.message}</p>`;
            }
        };

        window.consultarUsuarios = async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                const container = document.getElementById('usuarios');
                container.innerHTML = `<p class="font-bold">👥 Total: ${querySnapshot.size} usuarios</p>`;
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    container.innerHTML += `
                        <div class="border p-2 mt-2 rounded">
                            <p><strong>ID:</strong> ${doc.id}</p>
                            <p><strong>Email:</strong> ${data.email}</p>
                            <p><strong>Nombre:</strong> ${data.displayName || data.nombre}</p>
                            <p><strong>Rol:</strong> ${data.role || 'user'}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('usuarios').innerHTML = `<p class="text-red-600">Error: ${error.message}</p>`;
            }
        };

        window.listarTodasLasColecciones = () => {
            const container = document.getElementById('todas-colecciones');
            container.innerHTML = `
                <div class="text-sm">
                    <p class="font-bold mb-2">📋 Colecciones conocidas en el sistema:</p>
                    <ul class="list-disc list-inside space-y-1">
                        <li>participantes_online</li>
                        <li>participantes_presenciales</li>
                        <li>artist_profiles</li>
                        <li>users</li>
                        <li>certamenes_provinciales</li>
                        <li>admin_settings</li>
                        <li>videos_inscripcion</li>
                        <li>pagos</li>
                        <li>system_stats</li>
                        <li>payment_config</li>
                    </ul>
                    <p class="mt-4 text-gray-600">Usa los botones de arriba para consultar cada colección específica.</p>
                </div>
            `;
        };
    </script>
</body>
</html>
