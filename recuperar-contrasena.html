<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contrasea - VYT MUSIC</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="firebase-config.js"></script>
    
    <!-- Sistema de Navegacin Unificado -->
    <script src="/src/navigation-component.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="w-full max-w-md">
        <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-8 shadow-2xl">
            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-white/20 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <i class="fas fa-key text-4xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Recuperar Contrasea</h1>
                <p class="text-white/80">Te enviaremos un enlace a tu email</p>
            </div>

            <!-- Alert -->
            <div id="alert" class="hidden mb-6 p-4 rounded-xl text-sm"></div>

            <!-- Form -->
            <form id="resetForm" class="space-y-6">
                <div>
                    <label class="block text-white/90 font-semibold mb-2">
                        <i class="fas fa-envelope mr-2"></i> Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        required
                        placeholder="tu@email.com"
                        class="w-full bg-white/20 border border-white/30 text-white placeholder-white/50 rounded-xl px-4 py-3 focus:outline-none focus:border-white transition">
                </div>

                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full bg-white text-purple-600 font-bold py-4 rounded-xl hover:bg-white/90 transition-all transform hover:scale-105 shadow-lg">
                    <i class="fas fa-paper-plane mr-2"></i> Enviar Enlace de Recuperacin
                </button>
            </form>

            <!-- Back to login -->
            <div class="text-center mt-6 pt-6 border-t border-white/20">
                <a href="/index.html" class="text-white/80 hover:text-white transition">
                    <i class="fas fa-arrow-left mr-2"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>

    <script>
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const alertDiv = document.getElementById('alert');

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();

            if (!email) {
                showAlert('Por favor ingresa tu email', 'error');
                return;
            }

            // Validar formato email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('Por favor ingresa un email vlido', 'error');
                return;
            }

            // Deshabilitar botn
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Enviando...';

            try {
                // Enviar email de recuperacin
                await firebase.auth().sendPasswordResetEmail(email);
                
                showAlert(' Email enviado! Revisa tu bandeja de entrada', 'success');
                
                // Limpiar form
                resetForm.reset();
                
                // Redirigir despus de 3 segundos
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                
                let errorMessage = 'Hubo un error al enviar el email';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'No existe una cuenta con ese email';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Email invlido';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'Demasiados intentos. Intenta ms tarde';
                        break;
                }
                
                showAlert(errorMessage, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Enviar Enlace de Recuperacin';
            }
        });

        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = `mb-6 p-4 rounded-xl text-sm ${
                type === 'success' 
                    ? 'bg-green-500/20 border border-green-500/50 text-white' 
                    : 'bg-red-500/20 border border-red-500/50 text-white'
            }`;
            alertDiv.classList.remove('hidden');

            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.classList.add('hidden');
                }, 5000);
            }
        }
    </script>
</body>
</html>
