<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧹 Limpieza Total VYT</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin: 0 0 10px;
            font-size: 2.5rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .log {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            display: none;
        }
        .log-item {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }
        .log-success {
            border-left-color: #38ef7d;
            color: #11998e;
        }
        .log-error {
            border-left-color: #ff6b6b;
            color: #d63031;
        }
        .emoji {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .progress {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🧹</div>
        <h1>Limpieza Total</h1>
        <p class="subtitle">Elimina Service Workers y caché para cargar la versión más reciente</p>
        
        <button class="btn" onclick="limpiarTodo()">
            🚀 LIMPIAR TODO AHORA
        </button>
        
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="log" id="log"></div>
        
        <div id="success" style="display: none; margin-top: 30px;">
            <div class="emoji" style="animation: none;">✅</div>
            <h2 style="color: #11998e;">¡Limpieza Completa!</h2>
            <p style="color: #666; margin-bottom: 20px;">
                Ahora recarga la página con CTRL+F5 o presiona el botón
            </p>
            <button class="btn btn-success" onclick="window.location.href='/certamenes.html'">
                🎯 IR A CERTÁMENES
            </button>
        </div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            log.style.display = 'block';
            const item = document.createElement('div');
            item.className = 'log-item' + (type === 'success' ? ' log-success' : type === 'error' ? ' log-error' : '');
            item.textContent = message;
            log.appendChild(item);
            log.scrollTop = log.scrollHeight;
        }

        function updateProgress(percent) {
            document.getElementById('progress').style.display = 'block';
            document.getElementById('progressBar').style.width = percent + '%';
        }

        async function limpiarTodo() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ LIMPIANDO...';
            
            document.getElementById('log').innerHTML = '';
            document.getElementById('success').style.display = 'none';
            
            let progress = 0;
            updateProgress(0);
            
            try {
                // 1. Desregistrar Service Workers
                addLog('🔍 Buscando Service Workers...');
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    addLog(`📋 Encontrados ${registrations.length} Service Workers`);
                    
                    for (let registration of registrations) {
                        await registration.unregister();
                        addLog('✅ SW desregistrado: ' + registration.scope, 'success');
                    }
                    progress += 30;
                    updateProgress(progress);
                } else {
                    addLog('⚠️ Service Worker no soportado', 'error');
                }

                // 2. Limpiar todos los cachés
                addLog('🔍 Buscando cachés...');
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    addLog(`📦 Encontrados ${cacheNames.length} cachés`);
                    
                    for (let cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        addLog('✅ Caché eliminado: ' + cacheName, 'success');
                        progress += 40 / cacheNames.length;
                        updateProgress(Math.min(progress, 70));
                    }
                } else {
                    addLog('⚠️ Cache API no soportada', 'error');
                }

                progress = 70;
                updateProgress(progress);

                // 3. Limpiar localStorage relacionado
                addLog('🔍 Limpiando localStorage...');
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && (key.includes('vyt') || key.includes('firebase') || key.includes('cache'))) {
                        keysToRemove.push(key);
                    }
                }
                
                keysToRemove.forEach(key => {
                    localStorage.removeItem(key);
                    addLog('✅ Limpiado: ' + key, 'success');
                });
                
                progress = 85;
                updateProgress(progress);

                // 4. Limpiar sessionStorage
                addLog('🔍 Limpiando sessionStorage...');
                sessionStorage.clear();
                addLog('✅ SessionStorage limpiado', 'success');
                
                progress = 95;
                updateProgress(progress);

                // 5. Setear flag de limpieza
                localStorage.setItem('vyt_sw_cleanup', 'true');
                localStorage.setItem('vyt_cache_cleared', new Date().toISOString());
                addLog('✅ Flag de limpieza activado', 'success');
                
                progress = 100;
                updateProgress(progress);

                // Éxito
                setTimeout(() => {
                    document.getElementById('success').style.display = 'block';
                    btn.style.display = 'none';
                }, 500);

            } catch (error) {
                addLog('❌ ERROR: ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '🔄 REINTENTAR';
            }
        }

        // Auto-ejecutar si viene con parámetro ?auto=true
        if (window.location.search.includes('auto=true')) {
            setTimeout(() => {
                limpiarTodo();
            }, 1000);
        }
    </script>
</body>
</html>
