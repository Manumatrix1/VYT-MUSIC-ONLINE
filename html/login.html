<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iniciar Sesión - VYT MUSIC</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
	<style>
		:root {
			--color-primario: #58a6ff;
			--color-secundario: #2bb7d1;
			--color-oro: #FFD700;
			--color-fondo: #0d1117;
			--color-fondo-secundario: #161b22;
			--color-card: #21262d;
			--color-texto-principal: #f0f6fc;
			--color-texto-secundario: #8b949e;
			--color-error: #ff6b6b;
			--color-success: #40c057;
		}
		body {
			background: linear-gradient(135deg, var(--color-fondo) 0%, var(--color-fondo-secundario) 100%);
			font-family: 'Roboto', sans-serif;
			min-height: 100vh;
			color: var(--color-texto-principal);
		}
		.login-container {
			background: var(--color-card);
			border: 1px solid #30363d;
			border-radius: 20px;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
			backdrop-filter: blur(10px);
		}
		.form-input {
			background: var(--color-fondo-secundario);
			border: 2px solid #30363d;
			color: var(--color-texto-principal);
			transition: all 0.3s ease;
		}
		.form-input:focus {
			border-color: var(--color-primario);
			box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
			outline: none;
		}
		.btn-primary {
			background: linear-gradient(135deg, var(--color-primario), var(--color-oro));
			color: var(--color-fondo);
			border: none;
			transition: all 0.3s ease;
		}
	</style>
</head>
<body>

</body>
</html>
