<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - VYT MUSIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primario: #58a6ff;
            --color-secundario: #2bb7d1;
            --color-oro: #FFD700;
            --color-fondo: #0d1117;
            --color-fondo-secundario: #161b22;
            --color-card: #21262d;
            --color-texto-principal: #f0f6fc;
            --color-texto-secundario: #8b949e;
            --color-error: #ff6b6b;
            --color-success: #40c057;
        }

        body {
            background: linear-gradient(135deg, var(--color-fondo) 0%, var(--color-fondo-secundario) 100%);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            color: var(--color-texto-principal);
        }

        .login-container {
            background: var(--color-card);
            border: 1px solid #30363d;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .form-input {
            background: var(--color-fondo-secundario);
            border: 2px solid #30363d;
            color: var(--color-texto-principal);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--color-primario);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primario), var(--color-oro));
            color: var(--color-fondo);
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(88, 166, 255, 0.3);
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--color-error);
            color: var(--color-error);
        }

        .success-message {
            background: rgba(64, 192, 87, 0.1);
            border: 1px solid var(--color-success);
            color: var(--color-success);
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 8px;
            transition: all 0.3s ease;
        }

        .strength-weak { background: #ff6b6b; width: 25%; }
        .strength-fair { background: #ffd93d; width: 50%; }
        .strength-good { background: #6bcf7f; width: 75%; }
        .strength-strong { background: #40c057; width: 100%; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    
    <!-- Navegación superior -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-black/50 backdrop-blur-sm">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full flex items-center justify-center">
                    <span class="text-white font-bold">VYT</span>
                </div>
                <span class="text-xl font-bold text-white">VYT MUSIC</span>
            </a>
            <a href="login.html" class="text-gray-300 hover:text-white transition-colors">
                ¿Ya tienes cuenta? Iniciar sesión
            </a>
        </div>
    </header>

    <!-- Contenedor principal -->
    <div class="login-container w-full max-w-md p-8 mt-16">
        
        <!-- Logo y título -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold text-2xl">VYT</span>
            </div>
            <h1 class="text-3xl font-bold mb-2" style="font-family: 'Montserrat', sans-serif;">Crear Cuenta</h1>
            <p class="text-gray-400">Unite a la comunidad de VYT MUSIC</p>
        </div>

        <!-- Mensajes de error/éxito -->
        <div id="message-container" class="mb-6 hidden">
            <div id="error-message" class="error-message p-3 rounded-lg mb-3 hidden">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                    </svg>
                    <span id="error-text"></span>
                </div>
            </div>
            <div id="success-message" class="success-message p-3 rounded-lg mb-3 hidden">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                    </svg>
                    <span id="success-text"></span>
                </div>
            </div>
        </div>

        <!-- Formulario de registro -->
        <form id="register-form" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="firstName" class="block text-sm font-medium text-gray-300 mb-1">Nombre</label>
                    <input 
                        type="text" 
                        id="firstName" 
                        name="firstName" 
                        required 
                        class="form-input w-full px-3 py-2 rounded-lg text-sm"
                        placeholder="Tu nombre"
                    >
                </div>
                <div>
                    <label for="lastName" class="block text-sm font-medium text-gray-300 mb-1">Apellido</label>
                    <input 
                        type="text" 
                        id="lastName" 
                        name="lastName" 
                        required 
                        class="form-input w-full px-3 py-2 rounded-lg text-sm"
                        placeholder="Tu apellido"
                    >
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    class="form-input w-full px-3 py-2 rounded-lg"
                    placeholder="tu@email.com"
                    autocomplete="email"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Contraseña</label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        class="form-input w-full px-3 py-2 rounded-lg pr-10"
                        placeholder="••••••••"
                        autocomplete="new-password"
                    >
                    <button 
                        type="button" 
                        id="toggle-password" 
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-300"
                    >
                        <svg id="eye-open" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                        <svg id="eye-closed" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                        </svg>
                    </button>
                </div>
                <div class="password-strength" id="password-strength"></div>
                <p class="text-xs text-gray-400 mt-1" id="password-hint">
                    Mínimo 6 caracteres, incluye números y letras
                </p>
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-300 mb-1">Confirmar Contraseña</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    required 
                    class="form-input w-full px-3 py-2 rounded-lg"
                    placeholder="••••••••"
                    autocomplete="new-password"
                >
            </div>

            <div>
                <label for="userType" class="block text-sm font-medium text-gray-300 mb-1">Tipo de cuenta</label>
                <select id="userType" name="userType" class="form-input w-full px-3 py-2 rounded-lg">
                    <option value="fan">Fan / Votante</option>
                    <option value="artist">Artista</option>
                    <option value="artist_group">Banda / Grupo</option>
                </select>
            </div>

            <!-- Términos y condiciones -->
            <div class="flex items-start space-x-3">
                <input 
                    type="checkbox" 
                    id="terms" 
                    name="terms" 
                    required 
                    class="mt-1 rounded border-gray-600 text-blue-500 focus:ring-blue-500"
                >
                <label for="terms" class="text-sm text-gray-300">
                    Acepto los 
                    <a href="#" class="text-blue-400 hover:text-blue-300">términos y condiciones</a>
                    y la 
                    <a href="#" class="text-blue-400 hover:text-blue-300">política de privacidad</a>
                </label>
            </div>

            <!-- Newsletter -->
            <div class="flex items-center space-x-3">
                <input 
                    type="checkbox" 
                    id="newsletter" 
                    name="newsletter" 
                    class="rounded border-gray-600 text-blue-500 focus:ring-blue-500"
                >
                <label for="newsletter" class="text-sm text-gray-300">
                    Quiero recibir novedades y promociones por email
                </label>
            </div>

            <!-- Botón de registro -->
            <button 
                type="submit" 
                id="register-btn"
                class="btn-primary w-full py-3 px-4 rounded-lg font-semibold text-lg mt-6"
            >
                <span id="register-text">Crear Cuenta</span>
                <span id="register-loading" class="hidden">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Creando cuenta...
                </span>
            </button>
        </form>

        <!-- Enlace a login -->
        <div class="text-center mt-6 pt-4 border-t border-gray-600">
            <p class="text-gray-400">
                ¿Ya tienes cuenta? 
                <a href="login.html" class="text-blue-400 hover:text-blue-300 font-semibold">
                    Iniciar sesión
                </a>
            </p>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { 
            createUserWithEmailAndPassword, 
            updateProfile,
            sendEmailVerification 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            doc, 
            setDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Elementos del DOM
        const registerForm = document.getElementById('register-form');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const togglePassword = document.getElementById('toggle-password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');
        const passwordStrength = document.getElementById('password-strength');
        const passwordHint = document.getElementById('password-hint');

        // Toggle mostrar/ocultar contraseña
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            confirmPasswordInput.type = type;
            eyeOpen.classList.toggle('hidden');
            eyeClosed.classList.toggle('hidden');
        });

        // Validar fortaleza de contraseña
        passwordInput.addEventListener('input', (e) => {
            const password = e.target.value;
            const strength = calculatePasswordStrength(password);
            updatePasswordStrength(strength);
        });

        // Validar que las contraseñas coincidan
        confirmPasswordInput.addEventListener('input', (e) => {
            const password = passwordInput.value;
            const confirmPassword = e.target.value;
            
            if (confirmPassword && password !== confirmPassword) {
                e.target.setCustomValidity('Las contraseñas no coinciden');
            } else {
                e.target.setCustomValidity('');
            }
        });

        // Manejar envío del formulario
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            // Validaciones
            if (data.password !== data.confirmPassword) {
                showMessage('Las contraseñas no coinciden', 'error');
                return;
            }

            if (data.password.length < 6) {
                showMessage('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            if (!data.terms) {
                showMessage('Debes aceptar los términos y condiciones', 'error');
                return;
            }

            setLoading(true);

            try {
                // Crear usuario en Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, data.email, data.password);
                const user = userCredential.user;

                // Actualizar perfil
                await updateProfile(user, {
                    displayName: `${data.firstName} ${data.lastName}`
                });

                // Crear documento del usuario en Firestore
                await setDoc(doc(db, 'users', user.uid), {
                    firstName: data.firstName,
                    lastName: data.lastName,
                    email: data.email,
                    userType: data.userType,
                    newsletter: data.newsletter || false,
                    vyt_money_balance: 0,
                    verified: false,
                    createdAt: serverTimestamp(),
                    lastLogin: serverTimestamp(),
                    profile: {
                        avatar: null,
                        bio: '',
                        location: '',
                        social: {
                            instagram: '',
                            youtube: '',
                            tiktok: ''
                        }
                    },
                    stats: {
                        votes_given: 0,
                        votes_received: 0,
                        competitions_joined: 0,
                        total_spent: 0
                    }
                });

                // Enviar email de verificación
                await sendEmailVerification(user);

                showMessage('¡Cuenta creada exitosamente! Revisa tu email para verificar tu cuenta.', 'success');
                
                // Redirigir después de 3 segundos
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);

            } catch (error) {
                console.error('Error creating account:', error);
                let errorMessage = 'Error al crear la cuenta';
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'Este email ya está registrado';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'La contraseña es muy débil';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Email inválido';
                        break;
                    default:
                        errorMessage = 'Error: ' + error.message;
                }
                
                showMessage(errorMessage, 'error');
            } finally {
                setLoading(false);
            }
        });

        // Funciones auxiliares
        function calculatePasswordStrength(password) {
            let score = 0;
            
            if (password.length >= 6) score += 1;
            if (password.length >= 10) score += 1;
            if (/[a-z]/.test(password)) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^A-Za-z0-9]/.test(password)) score += 1;
            
            return Math.min(score, 4);
        }

        function updatePasswordStrength(strength) {
            const classes = ['strength-weak', 'strength-fair', 'strength-good', 'strength-strong'];
            const messages = [
                'Muy débil',
                'Débil', 
                'Aceptable',
                'Buena',
                'Muy fuerte'
            ];
            
            passwordStrength.className = 'password-strength';
            if (strength > 0) {
                passwordStrength.classList.add(classes[strength - 1]);
            }
            
            passwordHint.textContent = strength > 0 ? `Fortaleza: ${messages[strength]}` : 'Mínimo 6 caracteres, incluye números y letras';
        }

        function setLoading(loading) {
            const registerBtn = document.getElementById('register-btn');
            const registerText = document.getElementById('register-text');
            const registerLoading = document.getElementById('register-loading');
            
            if (loading) {
                registerBtn.disabled = true;
                registerText.classList.add('hidden');
                registerLoading.classList.remove('hidden');
            } else {
                registerBtn.disabled = false;
                registerText.classList.remove('hidden');
                registerLoading.classList.add('hidden');
            }
        }

        function showMessage(message, type) {
            const messageContainer = document.getElementById('message-container');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            const errorText = document.getElementById('error-text');
            const successText = document.getElementById('success-text');

            // Ocultar todos los mensajes
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');

            // Mostrar el mensaje apropiado
            if (type === 'error') {
                errorText.textContent = message;
                errorMessage.classList.remove('hidden');
            } else {
                successText.textContent = message;
                successMessage.classList.remove('hidden');
            }

            messageContainer.classList.remove('hidden');

            // Auto-ocultar después de 8 segundos
            setTimeout(() => {
                messageContainer.classList.add('hidden');
            }, 8000);
        }

        // Auto-focus en el nombre al cargar
        document.getElementById('firstName').focus();
    </script>
</body>
</html>
