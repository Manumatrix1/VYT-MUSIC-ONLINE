<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYT MUSIC - Blog Oficial</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <a href="principal.html">
                <img src="https://i.ibb.co/Ldwq7cNx/logo-blanco.png" alt="Logo VYT Music">
            </a>
        </div>
        <nav>
            <a href="principal.html" class="text-gray-300 hover:text-white font-bold">&larr; Volver a Principal</a>
        </nav>
    </header>

    <main class="py-10">
        <div class="container">
            <h2 class="titulo-seccion">Nuestro Blog</h2>
            <p class="subtitulo-seccion">Mantente al tanto de las últimas noticias, ganadores y eventos del certamen.</p>
            
            <div id="blog-posts-container" class="blog-grid">
                <p class="text-center text-gray-500">Cargando posts del blog...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        document.addEventListener('DOMContentLoaded', () => {
            const blogPostsContainer = document.getElementById('blog-posts-container');
            
            async function loadBlogPosts() {
                blogPostsContainer.innerHTML = '<p class="text-center text-gray-500">Cargando posts del blog...</p>';
                try {
                    const q = query(collection(db, "blog"), orderBy("createdAt", "desc"));
                    const querySnapshot = await getDocs(q);
                    
                    if (querySnapshot.empty) {
                        blogPostsContainer.innerHTML = '<p class="text-center text-gray-500">No hay posts de blog disponibles en este momento.</p>';
                        return;
                    }
                    
                    blogPostsContainer.innerHTML = '';
                    querySnapshot.forEach((docItem) => {
                        const post = docItem.data();
                        const postElement = document.createElement('div');
                        postElement.className = 'blog-post-card';
                        
                        let formattedDate = '';
                        if (post.createdAt && post.createdAt.toDate) {
                            formattedDate = new Date(post.createdAt.toDate()).toLocaleDateString('es-AR', {
                                year: 'numeric', month: 'long', day: 'numeric'
                            });
                        }

                        postElement.innerHTML = `
                            ${post.imagenUrl ? `<img src="${post.imagenUrl}" alt="${post.titulo}" class="w-full h-48 object-cover">` : ''}
                            <div class="blog-post-info">
                                <h4>${post.titulo}</h4>
                                <p class="date">${formattedDate}</p>
                                <p class="snippet">${post.contenido.substring(0, 150)}...</p>
                            </div>
                        `;
                        blogPostsContainer.appendChild(postElement);
                    });
                } catch (error) {
                    console.error("Error al cargar los posts del blog:", error);
                    blogPostsContainer.innerHTML = '<p class="text-center text-red-500">Error al cargar los posts. Por favor, inténtalo de nuevo más tarde.</p>';
                }
            }
            loadBlogPosts();
        });
    </script>
</body>
</html>
