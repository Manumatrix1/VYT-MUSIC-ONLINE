<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYT MUSIC - Inicio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* 🚨 TODO EL CSS INLINE - NO DEPENDE DE NADA EXTERNO */
        body {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.7)), url('images/fotos/chica-feliz-grabando-una-cancion.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Roboto', sans-serif;
            color: white;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .hero-section {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(45, 212, 191, 0.1));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            margin-bottom: 48px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3B82F6, #2DD4BF);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        /* NAVEGACIÓN INFERIOR - FORZADA INLINE */
        .bottom-nav {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(20px) !important;
            border-top: 1px solid rgba(59, 130, 246, 0.3) !important;
            z-index: 9999 !important;
            padding: 10px 0 !important;
        }

        .nav-container {
            display: flex !important;
            justify-content: space-around !important;
            align-items: center !important;
            max-width: 600px !important;
            margin: 0 auto !important;
            padding: 0 20px !important;
        }

        .nav-btn {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            text-decoration: none !important;
            color: rgba(255, 255, 255, 0.7) !important;
            padding: 8px 12px !important;
            border-radius: 8px !important;
            transition: all 0.2s ease !important;
            min-width: 60px !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            font-family: inherit !important;
        }

        .nav-btn:hover,
        .nav-btn.active {
            color: #3B82F6 !important;
            background: rgba(59, 130, 246, 0.1) !important;
            transform: translateY(-1px) !important;
        }

        .nav-icon {
            font-size: 18px !important;
            margin-bottom: 4px !important;
            display: block !important;
            line-height: 1 !important;
            width: 20px !important;
            height: 18px !important;
            text-align: center !important;
        }

        .nav-text {
            font-size: 10px !important;
            font-weight: 600 !important;
            text-align: center !important;
            white-space: nowrap !important;
        }

        /* ICONOS SIN FONT-AWESOME - EMOJIS */
        .icon-home::before { content: "🏠"; }
        .icon-trophy::before { content: "🏆"; }
        .icon-chart::before { content: "📊"; }
        .icon-menu::before { content: "☰"; }
        .icon-mic::before { content: "🎤"; }

        /* CONTENEDOR PRINCIPAL */
        .main-container {
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px; /* Espacio para navegación */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero-section {
                padding: 24px;
            }
            .btn-primary {
                padding: 12px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="text-center mb-12">
            <img src="https://i.ibb.co/Ldwq7cNx/logo-blanco.png" alt="VYT Music" style="width: 128px; margin: 0 auto 16px; display: block;">
            <h1 style="font-size: 2rem; font-weight: bold; margin-bottom: 8px;">VYT MUSIC</h1>
        </header>

        <main class="container">
            <section class="hero-section">
                <h1 style="font-size: 3rem; font-weight: bold; margin-bottom: 24px; line-height: 1.1;">
                    <span class="icon-mic"></span> ¡Bienvenido a VYT Music!
                </h1>
                <p style="font-size: 1.25rem; margin-bottom: 32px; max-width: 800px; margin-left: auto; margin-right: auto; opacity: 0.9;">
                    La plataforma de certámenes de canto más grande de Argentina. Descubre talentos, 
                    compite con los mejores y haz que tu voz se escuche.
                </p>

                <div style="display: flex; flex-direction: column; gap: 16px; justify-content: center; align-items: center;">
                    <a href="crear-perfil-artista.html" class="btn-primary">
                        <span class="icon-mic"></span>
                        Participar Ahora
                    </a>
                    <a href="ranking.html" class="btn-primary" style="background: linear-gradient(135deg, #6B7280, #4B5563);">
                        <span class="icon-trophy"></span>
                        Ver Ranking
                    </a>
                </div>
            </section>
        </main>
    </div>

    <!-- NAVEGACIÓN INFERIOR CON EMOJIS -->
    <nav class="bottom-nav">
        <div class="nav-container">
            <a href="principal-simple.html" class="nav-btn active">
                <span class="nav-icon icon-home"></span>
                <span class="nav-text">Principal</span>
            </a>
            <a href="certamenes.html" class="nav-btn">
                <span class="nav-icon icon-trophy"></span>
                <span class="nav-text">Certámenes</span>
            </a>
            <a href="ranking.html" class="nav-btn">
                <span class="nav-icon icon-chart"></span>
                <span class="nav-text">Ranking</span>
            </a>
            <button class="nav-btn" onclick="alert('Menú próximamente')">
                <span class="nav-icon icon-menu"></span>
                <span class="nav-text">Menú</span>
            </button>
        </div>
    </nav>

    <script>
        console.log('🎵 VYT MUSIC - Versión simple sin dependencias externas');
        
        // Verificar que la navegación se cargó
        setTimeout(() => {
            const nav = document.querySelector('.bottom-nav');
            if (nav) {
                console.log('✅ Navegación cargada correctamente');
            } else {
                console.log('❌ Error: Navegación no encontrada');
            }
        }, 100);
    </script>
</body>
</html>
