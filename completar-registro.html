<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completando Registro - VYT MUSIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white/10 backdrop-blur-lg rounded-3xl p-12 max-w-md w-full text-center shadow-2xl border border-white/20">
        
        <div id="loading" class="block">
            <div class="text-6xl mb-6 animate-bounce">⚙️</div>
            <h1 class="text-3xl font-bold text-white mb-4">Completando tu registro...</h1>
            <p class="text-white/80 text-lg mb-6">Estamos creando tu perfil de artista</p>
            <div class="w-16 h-16 border-4 border-white/30 border-t-white rounded-full animate-spin mx-auto"></div>
        </div>

        <div id="success" class="hidden">
            <div class="text-6xl mb-6">🎉</div>
            <h1 class="text-3xl font-bold text-white mb-4">¡Registro Completo!</h1>
            <p class="text-white/90 text-lg mb-6">Tu perfil de artista fue creado exitosamente</p>
            <p class="text-white/70 text-sm">Redirigiendo a tu perfil...</p>
        </div>

        <div id="error" class="hidden">
            <div class="text-6xl mb-6">❌</div>
            <h1 class="text-3xl font-bold text-white mb-4">Error</h1>
            <p id="errorMessage" class="text-white/90 text-lg mb-6"></p>
            <a href="index.html" class="inline-block bg-white/20 text-white px-6 py-3 rounded-xl font-bold hover:bg-white/30 transition-all">
                Volver al Inicio
            </a>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>

    <script>
    console.log('🎯 Completar Registro - Iniciado');

    async function completarRegistro() {
        try {
            // Esperar a que Firebase Auth esté listo
            const user = await new Promise((resolve, reject) => {
                firebase.auth().onAuthStateChanged(user => {
                    if (user) {
                        resolve(user);
                    } else {
                        reject(new Error('No hay usuario autenticado'));
                    }
                });
                
                // Timeout de 5 segundos
                setTimeout(() => reject(new Error('Timeout esperando autenticación')), 5000);
            });

            console.log('✅ Usuario autenticado:', user.email);

            // Verificar que el email esté verificado
            await user.reload();
            
            if (!user.emailVerified) {
                throw new Error('El email aún no está verificado. Por favor, hacé click en el link del email.');
            }

            console.log('✅ Email verificado correctamente');

            // Recuperar datos temporales de Firestore
            const db = firebase.firestore();
            const pendingDoc = await db.collection('pending_registrations').doc(user.uid).get();

            if (!pendingDoc.exists) {
                throw new Error('No se encontraron datos de registro pendientes.');
            }

            const tempData = pendingDoc.data();
            console.log('✅ Datos recuperados:', tempData.nombreArtistico);

            // Crear el perfil completo
            const artistData = {
                uid: user.uid,
                email: tempData.email,
                whatsapp: tempData.whatsapp,
                nombre: tempData.nombre,
                apellido: tempData.apellido,
                nombreArtistico: tempData.nombreArtistico,
                provincia: tempData.provincia,
                ciudad: tempData.ciudad,
                fechaNacimiento: tempData.fechaNacimiento,
                dni: tempData.dni || '',
                generos: tempData.generos,
                biografia: tempData.biografia || '',
                codigoPostal: tempData.codigoPostal || '',
                fechaCreacion: new Date().toISOString(),
                estado: 'activo',
                emailVerificado: true
            };

            // Guardar en users
            await db.collection('users').doc(user.uid).set({
                uid: user.uid,
                email: user.email,
                nombreCompleto: `${tempData.nombre} ${tempData.apellido}`,
                userType: 'artista',
                nombreArtistico: tempData.nombreArtistico,
                emailVerificado: true,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Guardar en artist_profiles
            await db.collection('artist_profiles').doc(user.uid).set(artistData);

            // Eliminar registro pendiente
            await db.collection('pending_registrations').doc(user.uid).delete();

            console.log('✅ Perfil creado exitosamente');

            // Guardar en localStorage
            localStorage.setItem('artistData', JSON.stringify(artistData));
            localStorage.setItem('artistData_persistent', JSON.stringify(artistData));
            localStorage.setItem('userEmail', artistData.email);

            // Mostrar éxito
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');

            // Redirigir
            setTimeout(() => {
                window.location.href = 'perfil-artista.html';
            }, 2000);

        } catch (error) {
            console.error('❌ Error:', error);
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = error.message;
        }
    }

    // Iniciar proceso
    completarRegistro();
    </script>

</body>
</html>
