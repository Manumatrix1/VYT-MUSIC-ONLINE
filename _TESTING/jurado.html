<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Jurado - VYT Music</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .star-rating {
            display: flex;
            gap: 8px;
            font-size: 2rem;
        }
        
        .star {
            cursor: pointer;
            color: #374151;
            transition: all 0.2s;
        }
        
        .star:hover,
        .star.active {
            color: #fbbf24;
            transform: scale(1.1);
        }
        
        .card-participant {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        
        .card-participant:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
        }
        
        .evaluated {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body class="text-white">
    <!-- Header -->
    <header class="bg-black/30 backdrop-blur-sm border-b border-white/10 py-4 sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <i class="fas fa-gavel text-3xl text-yellow-400"></i>
                    <div>
                        <h1 class="text-2xl font-bold">Panel de Jurado</h1>
                        <p class="text-sm text-white/60">Evaluación de Semifinalistas</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-sm text-white/60">Jurado:</p>
                        <p class="font-semibold" id="jurado-nombre">Cargando...</p>
                    </div>
                    <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition">
                        <i class="fas fa-sign-out-alt mr-2"></i> Salir
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        
        <!-- Estadísticas -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-blue-600/20 border border-blue-500/30 rounded-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-300 text-sm mb-1">Total Participantes</p>
                        <p class="text-3xl font-bold" id="stat-total">0</p>
                    </div>
                    <i class="fas fa-users text-4xl text-blue-400"></i>
                </div>
            </div>
            
            <div class="bg-green-600/20 border border-green-500/30 rounded-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-green-300 text-sm mb-1">Evaluados</p>
                        <p class="text-3xl font-bold" id="stat-evaluados">0</p>
                    </div>
                    <i class="fas fa-check-circle text-4xl text-green-400"></i>
                </div>
            </div>
            
            <div class="bg-yellow-600/20 border border-yellow-500/30 rounded-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-yellow-300 text-sm mb-1">Pendientes</p>
                        <p class="text-3xl font-bold" id="stat-pendientes">0</p>
                    </div>
                    <i class="fas fa-clock text-4xl text-yellow-400"></i>
                </div>
            </div>
            
            <div class="bg-purple-600/20 border border-purple-500/30 rounded-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-purple-300 text-sm mb-1">Progreso</p>
                        <p class="text-3xl font-bold" id="stat-progreso">0%</p>
                    </div>
                    <i class="fas fa-chart-line text-4xl text-purple-400"></i>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="bg-black/30 backdrop-blur-sm border border-white/10 rounded-lg p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm mb-2">Región</label>
                    <select id="filtro-region" class="w-full bg-gray-800 text-white px-4 py-2 rounded-lg border border-white/10">
                        <option value="todas">Todas las regiones</option>
                        <option value="norte">Norte</option>
                        <option value="centro">Centro</option>
                        <option value="sur">Sur</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm mb-2">Estado</label>
                    <select id="filtro-estado" class="w-full bg-gray-800 text-white px-4 py-2 rounded-lg border border-white/10">
                        <option value="todos">Todos</option>
                        <option value="pendientes">Pendientes</option>
                        <option value="evaluados">Evaluados</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm mb-2">Ordenar por</label>
                    <select id="filtro-orden" class="w-full bg-gray-800 text-white px-4 py-2 rounded-lg border border-white/10">
                        <option value="nombre">Nombre (A-Z)</option>
                        <option value="votos">Más votados</option>
                        <option value="fecha">Fecha inscripción</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Lista de Participantes -->
        <div id="participantes-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Se cargan dinámicamente -->
        </div>

        <!-- Mensaje cuando no hay participantes -->
        <div id="no-participantes" class="hidden text-center py-16">
            <i class="fas fa-inbox text-6xl text-white/20 mb-4"></i>
            <p class="text-xl text-white/60">No hay participantes para evaluar</p>
        </div>

    </main>

    <!-- Modal de Evaluación -->
    <div id="modal-evaluacion" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-gray-900 rounded-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <!-- Header del Modal -->
            <div class="sticky top-0 bg-gray-900 border-b border-white/10 p-6 flex items-center justify-between">
                <div>
                    <h3 class="text-2xl font-bold" id="modal-nombre">Nombre Artista</h3>
                    <p class="text-white/60" id="modal-ubicacion">Ciudad, Provincia</p>
                </div>
                <button onclick="cerrarModal()" class="text-white/60 hover:text-white text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Contenido del Modal -->
            <div class="p-6 space-y-6">
                <!-- Video -->
                <div class="video-container rounded-lg overflow-hidden" id="modal-video">
                    <!-- YouTube iframe -->
                </div>
                
                <!-- Información del participante -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-black/30 p-4 rounded-lg">
                        <p class="text-sm text-white/60 mb-1">Categoría</p>
                        <p class="font-semibold" id="modal-categoria">-</p>
                    </div>
                    <div class="bg-black/30 p-4 rounded-lg">
                        <p class="text-sm text-white/60 mb-1">Canción</p>
                        <p class="font-semibold" id="modal-cancion">-</p>
                    </div>
                    <div class="bg-black/30 p-4 rounded-lg">
                        <p class="text-sm text-white/60 mb-1">Votos Públicos</p>
                        <p class="font-semibold text-yellow-400" id="modal-votos">-</p>
                    </div>
                    <div class="bg-black/30 p-4 rounded-lg">
                        <p class="text-sm text-white/60 mb-1">Región</p>
                        <p class="font-semibold" id="modal-region">-</p>
                    </div>
                </div>
                
                <!-- Formulario de Evaluación -->
                <div class="bg-blue-600/10 border border-blue-500/30 rounded-lg p-6">
                    <h4 class="text-xl font-bold mb-6">Tu Evaluación</h4>
                    
                    <!-- Criterios de evaluación -->
                    <div class="space-y-6">
                        <!-- Técnica Vocal -->
                        <div>
                            <label class="block text-sm mb-2">1. Técnica Vocal (1-5 estrellas)</label>
                            <div class="star-rating" id="rating-tecnica">
                                <i class="fas fa-star star" data-criterio="tecnica" data-valor="1"></i>
                                <i class="fas fa-star star" data-criterio="tecnica" data-valor="2"></i>
                                <i class="fas fa-star star" data-criterio="tecnica" data-valor="3"></i>
                                <i class="fas fa-star star" data-criterio="tecnica" data-valor="4"></i>
                                <i class="fas fa-star star" data-criterio="tecnica" data-valor="5"></i>
                            </div>
                        </div>
                        
                        <!-- Interpretación -->
                        <div>
                            <label class="block text-sm mb-2">2. Interpretación y Emoción (1-5 estrellas)</label>
                            <div class="star-rating" id="rating-interpretacion">
                                <i class="fas fa-star star" data-criterio="interpretacion" data-valor="1"></i>
                                <i class="fas fa-star star" data-criterio="interpretacion" data-valor="2"></i>
                                <i class="fas fa-star star" data-criterio="interpretacion" data-valor="3"></i>
                                <i class="fas fa-star star" data-criterio="interpretacion" data-valor="4"></i>
                                <i class="fas fa-star star" data-criterio="interpretacion" data-valor="5"></i>
                            </div>
                        </div>
                        
                        <!-- Presencia Escénica -->
                        <div>
                            <label class="block text-sm mb-2">3. Presencia Escénica (1-5 estrellas)</label>
                            <div class="star-rating" id="rating-presencia">
                                <i class="fas fa-star star" data-criterio="presencia" data-valor="1"></i>
                                <i class="fas fa-star star" data-criterio="presencia" data-valor="2"></i>
                                <i class="fas fa-star star" data-criterio="presencia" data-valor="3"></i>
                                <i class="fas fa-star star" data-criterio="presencia" data-valor="4"></i>
                                <i class="fas fa-star star" data-criterio="presencia" data-valor="5"></i>
                            </div>
                        </div>
                        
                        <!-- Calidad de Producción -->
                        <div>
                            <label class="block text-sm mb-2">4. Calidad de Producción del Video (1-5 estrellas)</label>
                            <div class="star-rating" id="rating-produccion">
                                <i class="fas fa-star star" data-criterio="produccion" data-valor="1"></i>
                                <i class="fas fa-star star" data-criterio="produccion" data-valor="2"></i>
                                <i class="fas fa-star star" data-criterio="produccion" data-valor="3"></i>
                                <i class="fas fa-star star" data-criterio="produccion" data-valor="4"></i>
                                <i class="fas fa-star star" data-criterio="produccion" data-valor="5"></i>
                            </div>
                        </div>
                        
                        <!-- Puntuación Total -->
                        <div class="bg-yellow-600/20 border border-yellow-500/30 rounded-lg p-4">
                            <div class="flex justify-between items-center">
                                <span class="font-semibold">Puntuación Total:</span>
                                <span class="text-3xl font-bold text-yellow-400" id="puntuacion-total">0/20</span>
                            </div>
                        </div>
                        
                        <!-- Comentarios -->
                        <div>
                            <label class="block text-sm mb-2">Comentarios (opcional)</label>
                            <textarea id="comentarios" rows="4" 
                                class="w-full bg-gray-800 text-white px-4 py-3 rounded-lg border border-white/10 focus:border-blue-500 focus:outline-none resize-none"
                                placeholder="Observaciones sobre la presentación..."></textarea>
                        </div>
                    </div>
                </div>
                
                <!-- Botones -->
                <div class="flex gap-4">
                    <button onclick="guardarEvaluacion()" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-semibold transition">
                        <i class="fas fa-save mr-2"></i> Guardar Evaluación
                    </button>
                    <button onclick="cerrarModal()" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-lg transition">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        let participantesData = [];
        let evaluacionesGuardadas = {};
        let participanteActual = null;
        let puntuaciones = {
            tecnica: 0,
            interpretacion: 0,
            presencia: 0,
            produccion: 0
        };
        
        // Verificar autenticación
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login-artista.html';
                return;
            }
            
            // Verificar que sea jurado
            const juradoDoc = await firebase.firestore()
                .collection('jurados')
                .doc(user.uid)
                .get();
            
            if (!juradoDoc.exists) {
                alert('No tienes permisos de jurado');
                window.location.href = 'principal.html';
                return;
            }
            
            document.getElementById('jurado-nombre').textContent = juradoDoc.data().nombre || user.email;
            
            cargarParticipantes();
            cargarEvaluaciones();
        });
        
        // Cargar semifinalistas
        async function cargarParticipantes() {
            try {
                const snapshot = await firebase.firestore()
                    .collection('inscripciones')
                    .where('estado', '==', 'semifinalista')
                    .get();
                
                participantesData = [];
                snapshot.forEach(doc => {
                    participantesData.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                actualizarEstadisticas();
                renderizarParticipantes();
            } catch (error) {
                console.error('Error cargando participantes:', error);
            }
        }
        
        // Cargar evaluaciones previas del jurado
        async function cargarEvaluaciones() {
            const user = firebase.auth().currentUser;
            const snapshot = await firebase.firestore()
                .collection('evaluaciones_jurado')
                .where('juradoId', '==', user.uid)
                .get();
            
            evaluacionesGuardadas = {};
            snapshot.forEach(doc => {
                const data = doc.data();
                evaluacionesGuardadas[data.participanteId] = data;
            });
            
            actualizarEstadisticas();
            renderizarParticipantes();
        }
        
        // Actualizar estadísticas
        function actualizarEstadisticas() {
            const total = participantesData.length;
            const evaluados = Object.keys(evaluacionesGuardadas).length;
            const pendientes = total - evaluados;
            const progreso = total > 0 ? Math.round((evaluados / total) * 100) : 0;
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-evaluados').textContent = evaluados;
            document.getElementById('stat-pendientes').textContent = pendientes;
            document.getElementById('stat-progreso').textContent = progreso + '%';
        }
        
        // Renderizar participantes
        function renderizarParticipantes() {
            const container = document.getElementById('participantes-container');
            const noParticipantes = document.getElementById('no-participantes');
            
            let participantesFiltrados = [...participantesData];
            
            // Aplicar filtros
            const filtroRegion = document.getElementById('filtro-region').value;
            const filtroEstado = document.getElementById('filtro-estado').value;
            const filtroOrden = document.getElementById('filtro-orden').value;
            
            if (filtroRegion !== 'todas') {
                participantesFiltrados = participantesFiltrados.filter(p => p.codigoRegion === filtroRegion);
            }
            
            if (filtroEstado === 'pendientes') {
                participantesFiltrados = participantesFiltrados.filter(p => !evaluacionesGuardadas[p.id]);
            } else if (filtroEstado === 'evaluados') {
                participantesFiltrados = participantesFiltrados.filter(p => evaluacionesGuardadas[p.id]);
            }
            
            // Ordenar
            if (filtroOrden === 'nombre') {
                participantesFiltrados.sort((a, b) => a.nombreArtista.localeCompare(b.nombreArtista));
            } else if (filtroOrden === 'votos') {
                participantesFiltrados.sort((a, b) => (b.votos || 0) - (a.votos || 0));
            }
            
            if (participantesFiltrados.length === 0) {
                container.classList.add('hidden');
                noParticipantes.classList.remove('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            noParticipantes.classList.add('hidden');
            
            container.innerHTML = participantesFiltrados.map(p => {
                const evaluado = evaluacionesGuardadas[p.id];
                const regionColor = {
                    norte: '#FF6B6B',
                    centro: '#4ECDC4',
                    sur: '#95E1D3'
                }[p.codigoRegion] || '#6B7280';
                
                return `
                    <div class="card-participant ${evaluado ? 'evaluated' : ''} rounded-lg p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex-1">
                                <h3 class="text-xl font-bold mb-1">${p.nombreArtista || 'Sin nombre'}</h3>
                                <p class="text-sm text-white/60">${p.ciudad}, ${p.provincia}</p>
                                <p class="text-sm mt-1" style="color: ${regionColor}">
                                    <i class="fas fa-map-marker-alt mr-1"></i> Región ${p.region || 'Centro'}
                                </p>
                            </div>
                            ${evaluado ? '<i class="fas fa-check-circle text-3xl text-green-400"></i>' : ''}
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="bg-black/30 p-3 rounded">
                                <p class="text-xs text-white/60 mb-1">Categoría</p>
                                <p class="text-sm font-semibold">${p.categoria || '-'}</p>
                            </div>
                            <div class="bg-black/30 p-3 rounded">
                                <p class="text-xs text-white/60 mb-1">Votos</p>
                                <p class="text-sm font-semibold text-yellow-400">${p.votos || 0}</p>
                            </div>
                        </div>
                        
                        ${evaluado ? `
                            <div class="bg-green-600/20 border border-green-500/30 rounded p-3 mb-4">
                                <p class="text-sm text-green-300">
                                    <i class="fas fa-star mr-1"></i> 
                                    Puntuación: ${evaluado.puntuacionTotal}/20
                                </p>
                            </div>
                        ` : ''}
                        
                        <button onclick="abrirEvaluacion('${p.id}')" 
                            class="w-full ${evaluado ? 'bg-blue-600 hover:bg-blue-700' : 'bg-green-600 hover:bg-green-700'} text-white py-3 rounded-lg font-semibold transition">
                            <i class="fas ${evaluado ? 'fa-edit' : 'fa-clipboard-check'} mr-2"></i>
                            ${evaluado ? 'Ver / Editar Evaluación' : 'Evaluar Participante'}
                        </button>
                    </div>
                `;
            }).join('');
        }
        
        // Abrir modal de evaluación
        function abrirEvaluacion(participanteId) {
            participanteActual = participantesData.find(p => p.id === participanteId);
            if (!participanteActual) return;
            
            // Rellenar información
            document.getElementById('modal-nombre').textContent = participanteActual.nombreArtista;
            document.getElementById('modal-ubicacion').textContent = `${participanteActual.ciudad}, ${participanteActual.provincia}`;
            document.getElementById('modal-categoria').textContent = participanteActual.categoria;
            document.getElementById('modal-cancion').textContent = participanteActual.tituloCancion;
            document.getElementById('modal-votos').textContent = participanteActual.votos || 0;
            document.getElementById('modal-region').textContent = participanteActual.region || 'Centro';
            
            // Cargar video de YouTube
            const videoId = extraerYouTubeId(participanteActual.videoURL);
            document.getElementById('modal-video').innerHTML = `
                <iframe src="https://www.youtube.com/embed/${videoId}" 
                    frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen></iframe>
            `;
            
            // Resetear o cargar evaluación previa
            const evaluacionPrevia = evaluacionesGuardadas[participanteId];
            if (evaluacionPrevia) {
                puntuaciones = {
                    tecnica: evaluacionPrevia.tecnica,
                    interpretacion: evaluacionPrevia.interpretacion,
                    presencia: evaluacionPrevia.presencia,
                    produccion: evaluacionPrevia.produccion
                };
                document.getElementById('comentarios').value = evaluacionPrevia.comentarios || '';
            } else {
                puntuaciones = { tecnica: 0, interpretacion: 0, presencia: 0, produccion: 0 };
                document.getElementById('comentarios').value = '';
            }
            
            actualizarEstrellas();
            actualizarPuntuacionTotal();
            
            document.getElementById('modal-evaluacion').classList.remove('hidden');
            document.getElementById('modal-evaluacion').classList.add('flex');
        }
        
        // Cerrar modal
        function cerrarModal() {
            document.getElementById('modal-evaluacion').classList.add('hidden');
            document.getElementById('modal-evaluacion').classList.remove('flex');
        }
        
        // Extraer ID de YouTube
        function extraerYouTubeId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            return match ? match[1] : '';
        }
        
        // Sistema de estrellas
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('star')) {
                const criterio = e.target.dataset.criterio;
                const valor = parseInt(e.target.dataset.valor);
                puntuaciones[criterio] = valor;
                actualizarEstrellas();
                actualizarPuntuacionTotal();
            }
        });
        
        function actualizarEstrellas() {
            for (const [criterio, valor] of Object.entries(puntuaciones)) {
                const estrellas = document.querySelectorAll(`[data-criterio="${criterio}"]`);
                estrellas.forEach((estrella, idx) => {
                    if (idx < valor) {
                        estrella.classList.add('active');
                    } else {
                        estrella.classList.remove('active');
                    }
                });
            }
        }
        
        function actualizarPuntuacionTotal() {
            const total = Object.values(puntuaciones).reduce((a, b) => a + b, 0);
            document.getElementById('puntuacion-total').textContent = `${total}/20`;
        }
        
        // Guardar evaluación
        async function guardarEvaluacion() {
            const user = firebase.auth().currentUser;
            const total = Object.values(puntuaciones).reduce((a, b) => a + b, 0);
            
            if (total === 0) {
                alert('Debes asignar al menos una puntuación');
                return;
            }
            
            try {
                const evaluacionData = {
                    juradoId: user.uid,
                    participanteId: participanteActual.id,
                    tecnica: puntuaciones.tecnica,
                    interpretacion: puntuaciones.interpretacion,
                    presencia: puntuaciones.presencia,
                    produccion: puntuaciones.produccion,
                    puntuacionTotal: total,
                    comentarios: document.getElementById('comentarios').value,
                    fechaEvaluacion: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                // Guardar o actualizar
                const docId = `${user.uid}_${participanteActual.id}`;
                await firebase.firestore()
                    .collection('evaluaciones_jurado')
                    .doc(docId)
                    .set(evaluacionData);
                
                alert('✅ Evaluación guardada correctamente');
                cerrarModal();
                cargarEvaluaciones();
            } catch (error) {
                console.error('Error guardando evaluación:', error);
                alert('❌ Error al guardar la evaluación');
            }
        }
        
        // Event listeners para filtros
        document.getElementById('filtro-region').addEventListener('change', renderizarParticipantes);
        document.getElementById('filtro-estado').addEventListener('change', renderizarParticipantes);
        document.getElementById('filtro-orden').addEventListener('change', renderizarParticipantes);
        
        // Cerrar sesión
        function cerrarSesion() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'login-artista.html';
            });
        }
    </script>
</body>
</html>
