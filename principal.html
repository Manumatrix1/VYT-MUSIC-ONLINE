    <script>
        console.log('?? VYT MUSIC - Versin simple sin dependencias externas');
        
        // PROTECCIN DE RUTA - Verificar autenticacin
        function checkAuth() {
            if (window.authHandler && window.authHandler.initialized) {
                if (!window.authHandler.isLoggedIn()) {
                    console.log('?? Usuario no autenticado, redirigiendo a login...');
                    window.location.href = 'login.html';
                } else {
                    console.log('? Usuario autenticado:', window.authHandler.user.email);
                    console.log('?? Tipo de usuario:', window.authHandler.userType);
                }
            } else {
                setTimeout(checkAuth, 100);
            }
        }
        
        checkAuth();
        
        // Verificar que la navegacin se carg
        setTimeout(() => {
            const nav = document.querySelector('.bottom-navigation');
            if (nav) {
                console.log('? Navegacin cargada correctamente');
            } else {
                console.log('? Error: Navegacin no encontrada');
            }
        }, 100);

        // FUNCIONES DEL MEN
        function toggleMenu() {
            const menuOverlay = document.getElementById('menuOverlay');
            if (menuOverlay.classList.contains('active')) {
                closeMenu();
            } else {
                openMenu();
            }
        }

        function openMenu() {
            const menuOverlay = document.getElementById('menuOverlay');
            menuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            console.log('?? Men sidebar abierto desde la derecha');
        }

        function closeMenu() {
            const menuOverlay = document.getElementById('menuOverlay');
            menuOverlay.classList.remove('active');
            document.body.style.overflow = '';
            console.log('?? Men sidebar cerrado');
        }

        function showContact() {
            alert('?? Contacto VYT MUSIC\n\n?? Email: info@vytmusic.com\n?? WhatsApp: +54 9 11 1234-5678\n?? Web: vytmusic.com\n\nEstamos aqu para ayudarte!');
            closeMenu();
        }



        // Cerrar men con tecla ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeMenu();
            }
        });
    </script>
