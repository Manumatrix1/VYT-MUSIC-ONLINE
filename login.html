<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYT Music - Iniciar Sesión</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Inicia sesión en VYT Music">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png?v=1767433485">
    
    <!-- Design Tokens - Sistema Unificado -->
    <link rel="stylesheet" href="/design-tokens.css">
    
    <!-- Google Analytics 4 - Descomentar y configurar ID -->
    <!-- <script src="/src/google-analytics.js"></script> -->
    <!-- <script src="/src/recaptcha.js"></script> -->
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        .logo-section h1 {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .logo-section p {
            color: #666;
            font-size: 14px;
        }

        .social-login {
            margin-bottom: 30px;
        }

        .btn-social {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn-google {
            background: #fff;
            color: #444;
            border: 2px solid #ddd;
        }

        .btn-google:hover {
            background: #f8f9fa;
            border-color: #4285f4;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 133, 244, 0.3);
        }

        .btn-facebook {
            background: #1877f2;
            color: white;
        }

        .btn-facebook:hover {
            background: #0c63d4;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(24, 119, 242, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #999;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider span {
            padding: 0 15px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle button {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 5px;
        }

        .register-section {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e0e0e0;
        }

        .register-section p {
            color: #666;
            margin-bottom: 15px;
        }

        .btn-register {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-register:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-home:hover {
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="login-container">
        <div class="logo-section">
            <img src="https://i.ibb.co/Ldwq7cNx/logo-blanco.png" alt="VYT Music" style="filter: brightness(0);">
            <h1>¡Bienvenido! 🎵</h1>
            <p>Inicia sesión para continuar</p>
        </div>

        <!-- Alerta de mensajes -->
        <div id="alertMessage" class="alert alert-error" style="display: none;"></div>

        <!-- Login con redes sociales -->
        <div class="social-login">
            <button class="btn-social btn-google" id="btnGoogle">
                <svg width="20" height="20" viewBox="0 0 20 20">
                    <path fill="#4285F4" d="M19.6 10.23c0-.82-.1-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z"/>
                    <path fill="#34A853" d="M13.46 15.13c-.83.59-1.96 1-3.46 1-2.64 0-4.88-1.74-5.68-4.15H1.07v2.52C2.72 17.75 6.09 20 10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45z"/>
                    <path fill="#FBBC05" d="M3.99 10c0-.69.12-1.35.32-1.97V5.51H1.07A9.973 9.973 0 000 10c0 1.61.39 3.14 1.07 4.49l3.24-2.52c-.2-.62-.32-1.28-.32-1.97z"/>
                    <path fill="#EA4335" d="M10 3.88c1.88 0 3.13.81 3.85 1.48l2.84-2.76C14.96.99 12.7 0 10 0 6.09 0 2.72 2.25 1.07 5.51l3.24 2.52C5.12 5.62 7.36 3.88 10 3.88z"/>
                </svg>
                Continuar con Google
            </button>

            <button class="btn-social btn-facebook" id="btnFacebook">
                <i class="fab fa-facebook-f"></i>
                Continuar con Facebook
            </button>
        </div>

        <div class="divider">
            <span>o con email</span>
        </div>

        <!-- Formulario de login con email -->
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="" autocomplete="off" value="" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-toggle">
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" value="" required>
                    <button type="button" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="btnLogin">
                <span id="loginText">Iniciar Sesión</span>
                <span id="loginSpinner" class="loading" style="display: none;"></span>
            </button>
        </form>

        <div class="links">
            <a href="reset-password.html">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="register-section">
            <p>¿No tienes cuenta?</p>
            <a href="register.html" class="btn-register">Crear Cuenta</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="src/auth-handler.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Esperar a que authHandler esté listo
        function waitForAuth() {
            if (window.authHandler && window.authHandler.initialized) {
                initLoginHandlers();
            } else {
                setTimeout(waitForAuth, 100);
            }
        }

        // Iniciar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', waitForAuth);
        } else {
            waitForAuth();
        }

        function initLoginHandlers() {
            // Login con email
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const btnLogin = document.getElementById('btnLogin');
                const loginText = document.getElementById('loginText');
                const loginSpinner = document.getElementById('loginSpinner');

                btnLogin.disabled = true;
                loginText.textContent = 'Iniciando...';
                loginSpinner.style.display = 'inline-block';

                const result = await window.authHandler.loginWithEmail(email, password);

                if (result.success) {
                    showMessage('¡Bienvenido! Redirigiendo...', 'success');
                    setTimeout(() => {
                        if (window.authHandler.isArtista()) {
                            window.location.href = 'perfil-artista.html';
                        } else {
                            window.location.href = 'perfil.html';
                        }
                    }, 1000);
                } else {
                    showMessage(result.error, 'error');
                    btnLogin.disabled = false;
                    loginText.textContent = 'Iniciar Sesión';
                    loginSpinner.style.display = 'none';
                }
            });

            // Login con Google
            document.getElementById('btnGoogle').addEventListener('click', async () => {
                const btn = document.getElementById('btnGoogle');
                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span> Conectando...';

                const result = await window.authHandler.loginWithGoogle();

                if (result.success) {
                    showMessage('¡Bienvenido! Redirigiendo...', 'success');
                    setTimeout(() => {
                        if (window.authHandler.isArtista()) {
                            window.location.href = 'perfil-artista.html';
                        } else {
                            window.location.href = 'perfil.html';
                        }
                    }, 1000);
                } else {
                    showMessage(result.error, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20"><path fill="#4285F4" d="M19.6 10.23c0-.82-.1-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z"/><path fill="#34A853" d="M13.46 15.13c-.83.59-1.96 1-3.46 1-2.64 0-4.88-1.74-5.68-4.15H1.07v2.52C2.72 17.75 6.09 20 10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45z"/><path fill="#FBBC05" d="M3.99 10c0-.69.12-1.35.32-1.97V5.51H1.07A9.973 9.973 0 000 10c0 1.61.39 3.14 1.07 4.49l3.24-2.52c-.2-.62-.32-1.28-.32-1.97z"/><path fill="#EA4335" d="M10 3.88c1.88 0 3.13.81 3.85 1.48l2.84-2.76C14.96.99 12.7 0 10 0 6.09 0 2.72 2.25 1.07 5.51l3.24 2.52C5.12 5.62 7.36 3.88 10 3.88z"/></svg> Continuar con Google';
                }
            });

            // Login con Facebook
            document.getElementById('btnFacebook').addEventListener('click', async () => {
                const btn = document.getElementById('btnFacebook');
                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span> Conectando...';

                const result = await window.authHandler.loginWithFacebook();

                if (result.success) {
                    showMessage('¡Bienvenido! Redirigiendo...', 'success');
                    setTimeout(() => {
                        if (window.authHandler.isArtista()) {
                            window.location.href = 'perfil-artista.html';
                        } else {
                            window.location.href = 'perfil.html';
                        }
                    }, 1000);
                } else {
                    showMessage(result.error, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fab fa-facebook-f"></i> Continuar con Facebook';
                }
            });
        }

        function showMessage(message, type) {
            const alert = document.getElementById('alertMessage');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
