<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - VYT MUSIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primario: #58a6ff;
            --color-secundario: #2bb7d1;
            --color-oro: #FFD700;
            --color-fondo: #0d1117;
            --color-fondo-secundario: #161b22;
            --color-card: #21262d;
            --color-texto-principal: #f0f6fc;
            --color-texto-secundario: #8b949e;
            --color-error: #ff6b6b;
            --color-success: #40c057;
        }

        body {
            background: linear-gradient(135deg, var(--color-fondo) 0%, var(--color-fondo-secundario) 100%);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            color: var(--color-texto-principal);
        }

        .login-container {
            background: var(--color-card);
            border: 1px solid #30363d;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .form-input {
            background: var(--color-fondo-secundario);
            border: 2px solid #30363d;
            color: var(--color-texto-principal);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--color-primario);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primario), var(--color-oro));
            color: var(--color-fondo);
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(88, 166, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--color-secundario);
            color: var(--color-secundario);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--color-secundario);
            color: var(--color-fondo);
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--color-error);
            color: var(--color-error);
        }

        .success-message {
            background: rgba(64, 192, 87, 0.1);
            border: 1px solid var(--color-success);
            color: var(--color-success);
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .social-btn {
            background: var(--color-fondo-secundario);
            border: 1px solid #30363d;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .social-btn:hover {
            border-color: var(--color-primario);
            transform: translateY(-1px);
        }

        .facebook-btn {
            background: #1877f2;
            border-color: #1877f2;
            color: white;
        }

        .facebook-btn:hover {
            background: #166fe5;
            border-color: #166fe5;
        }

        .google-btn {
            background: white;
            border-color: #dadce0;
            color: #3c4043;
        }

        .google-btn:hover {
            background: #f8f9fa;
            border-color: #d2e3fc;
        }

        .divider {
            position: relative;
            text-align: center;
            margin: 1.5rem 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #30363d;
        }

        .divider span {
            background: var(--color-card);
            padding: 0 1rem;
            color: var(--color-texto-secundario);
            font-size: 0.875rem;
        }

        /* Estilo para checkbox recordarme */
        .form-checkbox {
            appearance: none;
            background-color: #374151;
            border: 1px solid #6b7280;
            border-radius: 0.25rem;
            cursor: pointer;
            position: relative;
        }

        .form-checkbox:checked {
            background-color: #2bb7d1;
            border-color: #2bb7d1;
        }

        .form-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-size: 12px;
            font-weight: bold;
        }

        .form-checkbox:hover {
            border-color: #2bb7d1;
        }

        .form-checkbox:focus {
            outline: none;
            border-color: #2bb7d1;
            box-shadow: 0 0 0 2px rgba(43, 183, 209, 0.2);
        }

        .social-btn:hover {
            border-color: var(--color-primario);
            transform: translateY(-1px);
        }
        
        .btn-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(43, 183, 209, 0.7);
        }
        
        .error-message {
            color: #ff4d4d;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .password-input-container {
            position: relative;
        }
        
        .toggle-password-visibility {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9ca3af;
        }
        
        .toggle-password-visibility:hover {
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-black/50 backdrop-blur-sm p-4 flex items-center justify-between shadow-lg sticky top-0 z-50">
        <div class="flex items-center space-x-4">
            <img src="https://i.ibb.co/Ldwq7cNx/logo-blanco.png" alt="Logo VYT Music" class="w-28">
        </div>
        <nav class="flex items-center space-x-4 text-sm">
            <a href="principal.html" class="text-gray-300 hover:text-white">&larr; Volver</a>
        </nav>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <h1 class="font-display text-4xl md:text-5xl font-black">Acceso Artistas</h1>
                <p class="text-gray-400 mt-2">Inicia sesión o regístrate para gestionar tus participaciones.</p>
            </div>
            
            <div class="bg-gray-800 p-8 rounded-lg shadow-lg">
                <div class="flex justify-center mb-6">
                    <button id="show-login" class="px-4 py-2 rounded-l-lg font-bold text-lg transition-colors duration-200 bg-[#2bb7d1] text-black">Iniciar Sesión</button>
                    <button id="show-register" class="px-4 py-2 rounded-r-lg font-bold text-lg transition-colors duration-200 bg-gray-700 text-gray-300">Registrarse</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="login-email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                        <input type="email" id="login-email" name="email" class="w-full form-input p-3 rounded-lg" placeholder="tu-correo@ejemplo.com" required>
                    </div>
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-gray-300 mb-1">Contraseña</label>
                        <div class="password-input-container">
                            <input type="password" id="login-password" name="password" class="w-full form-input p-3 rounded-lg pr-10" placeholder="Tu contraseña" required>
                            <span class="toggle-password-visibility" data-target="login-password">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </span>
                        </div>
                        <a href="reset-password.html" class="text-sm text-gray-400 hover:text-[#2bb7d1] mt-2 block text-right">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <!-- Checkbox Recordarme -->
                    <div class="flex items-center">
                        <input type="checkbox" id="remember-me" name="remember-me" class="form-checkbox h-4 w-4 text-[#2bb7d1] bg-gray-700 border-gray-600 rounded focus:ring-[#2bb7d1] focus:ring-2">
                        <label for="remember-me" class="ml-2 text-sm text-gray-300">Recordarme por 30 días</label>
                    </div>
                    
                    <p id="login-error" class="error-message">Error al iniciar sesión.</p>
                    <button type="submit" class="btn-submit w-full bg-[#2bb7d1] text-black py-4 rounded-full font-bold text-lg">
                        Iniciar Sesión
                    </button>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="space-y-6 hidden">
                    <div>
                        <label for="register-email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                        <input type="email" id="register-email" name="email" class="w-full form-input p-3 rounded-lg" placeholder="tu-correo@ejemplo.com" required>
                    </div>
                    <div>
                        <label for="register-password" class="block text-sm font-medium text-gray-300 mb-1">Contraseña</label>
                        <input type="password" id="register-password" name="password" class="w-full form-input p-3 rounded-lg" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>
                    <div>
                        <label for="confirm-password" class="block text-sm font-medium text-gray-300 mb-1">Confirmar Contraseña</label>
                        <input type="password" id="confirm-password" name="confirm-password" class="w-full form-input p-3 rounded-lg" placeholder="Repite tu contraseña" required minlength="6">
                    </div>
                    <p id="register-error" class="error-message">Error al registrarse.</p>
                    <button type="submit" class="btn-submit w-full bg-[#2bb7d1] text-black py-4 rounded-full font-bold text-lg">
                        Registrarse
                    </button>
                </form>

                <!-- Social Buttons (shown for both login and register) -->
                <div id="social-buttons" class="mt-6">
                    <!-- Divider -->
                    <div class="divider">
                        <span>O continúa con</span>
                    </div>

                    <!-- Social Login Buttons -->
                    <div class="space-y-3">
                        <button id="facebook-login-btn" class="social-btn facebook-btn w-full py-3 px-4 rounded-lg font-medium text-sm relative">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                            Continuar con Facebook
                            <span class="absolute -top-2 -right-2 bg-blue-500 text-white text-xs px-2 py-1 rounded-full">Beta</span>
                        </button>
                        
                        <button id="google-login-btn" class="social-btn google-btn w-full py-3 px-4 rounded-lg font-medium text-sm">
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Continuar con Google
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <!-- Facebook SDK -->
    <script>
      window.fbAsyncInit = function() {
        FB.init({
          appId      : '1815856085687196',  // Tu App ID de Facebook
          cookie     : true,
          xfbml      : true,
          version    : 'v18.0'
        });
          
        FB.AppEvents.logPageView();   
        
        // Verificar estado de login al cargar la página
        FB.getLoginStatus(function(response) {
            statusChangeCallback(response);
        });
          
      };

      // Callback para manejar cambios en el estado de login
      function statusChangeCallback(response) {
        console.log('Facebook Login Status:', response);
        
        if (response.status === 'connected') {
            // Usuario está logueado en Facebook y conectado a tu app
            console.log('Usuario conectado a Facebook:', response.authResponse);
            
            // Obtener información del usuario
            FB.api('/me', {fields: 'name,email,picture'}, function(userInfo) {
                console.log('Info del usuario desde Facebook:', userInfo);
                
                // Aquí podrías auto-loguear al usuario o mostrar su info
                // Por ahora solo guardamos que está conectado
                localStorage.setItem('facebookConnected', 'true');
                localStorage.setItem('facebookUserInfo', JSON.stringify(userInfo));
            });
            
        } else if (response.status === 'not_authorized') {
            // Usuario está logueado en Facebook pero no autorizó tu app
            console.log('Usuario no ha autorizado la app');
            localStorage.removeItem('facebookConnected');
            
        } else {
            // Usuario no está logueado en Facebook
            console.log('Usuario no está logueado en Facebook');
            localStorage.removeItem('facebookConnected');
        }
      }

      // Función para verificar estado de login (puede ser llamada desde botones)
      function checkLoginState() {
        FB.getLoginStatus(function(response) {
          statusChangeCallback(response);
        });
      }

      (function(d, s, id){
         var js, fjs = d.getElementsByTagName(s)[0];
         if (d.getElementById(id)) {return;}
         js = d.createElement(s); js.id = id;
         js.src = "https://connect.facebook.net/es_ES/sdk.js";
         fjs.parentNode.insertBefore(js, fjs);
       }(document, 'script', 'facebook-jssdk'));
    </script>

    <script>
        // Inicializar Firebase con configuración completa
        const firebaseConfig = {
            apiKey: "AIzaSyB_LRm2DUhQXwlaCFGc4pqzWs6OiMdRqlk",
            authDomain: "vytonlineprueva.firebaseapp.com",
            projectId: "vytonlineprueva",
            storageBucket: "vytonlineprueva.firebasestorage.app",
            messagingSenderId: "175483939728",
            appId: "1:175483939728:web:230294acca9221d1d1a115",
            measurementId: "G-PWRTMBH631"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Inicializar proveedores de autenticación
        const facebookProvider = new firebase.auth.FacebookAuthProvider();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // Configurar alcances adicionales
        facebookProvider.addScope('email');
        facebookProvider.addScope('public_profile');
        googleProvider.addScope('email');
        googleProvider.addScope('profile');

        // Función para manejar autenticación con Facebook
        async function signInWithFacebook() {
            try {
                console.log('Iniciando autenticación con Facebook...');
                
                // Primero verificar si ya está conectado
                FB.getLoginStatus(function(response) {
                    if (response.status === 'connected') {
                        // Ya está conectado, proceder con la autenticación
                        console.log('Usuario ya conectado a Facebook');
                        authenticateWithFacebookToken(response.authResponse.accessToken);
                    } else {
                        // No está conectado, mostrar dialog de login
                        FB.login(function(loginResponse) {
                            if (loginResponse.authResponse) {
                                console.log('Login exitoso con Facebook SDK');
                                authenticateWithFacebookToken(loginResponse.authResponse.accessToken);
                            } else {
                                console.log('Usuario canceló el login');
                                alert('Login cancelado');
                            }
                        }, {scope: 'email,public_profile'});
                    }
                });
                
            } catch (error) {
                console.error('Error general en autenticación con Facebook:', error);
                handleFacebookError(error);
            }
        }

        // Función auxiliar para autenticar con token de Facebook
        async function authenticateWithFacebookToken(accessToken) {
            try {
                // Método 1: Intentar con Firebase Auth
                const credential = firebase.auth.FacebookAuthProvider.credential(accessToken);
                const result = await firebase.auth().signInWithCredential(credential);
                console.log('Usuario autenticado con Firebase usando Facebook token:', result.user);
                
                // Marcar como logueado y redirigir
                localStorage.setItem('userLoggedIn', 'true');
                window.location.href = 'principal.html';
                
            } catch (firebaseError) {
                console.log('Firebase Auth falló, usando método alternativo...', firebaseError);
                
                // Método alternativo: obtener info del usuario y guardar localmente
                FB.api('/me', {fields: 'name,email,picture'}, function(userInfo) {
                    console.log('Info del usuario:', userInfo);
                    
                    // Guardar información en localStorage como alternativa
                    localStorage.setItem('userLoggedIn', 'true');
                    localStorage.setItem('userName', userInfo.name);
                    localStorage.setItem('userEmail', userInfo.email || '');
                    localStorage.setItem('userPhoto', userInfo.picture?.data?.url || '');
                    localStorage.setItem('loginMethod', 'facebook');
                    
                    alert('¡Bienvenido ' + userInfo.name + '! Login con Facebook exitoso.');
                    window.location.href = 'principal.html';
                });
            }
        }

        // Función para manejar errores de Facebook
        function handleFacebookError(error) {
            let errorMessage = '🔧 Facebook Login está en configuración. Por ahora puedes:\n\n✅ Registrarte con email\n✅ Usar Google (disponible)\n\nPronto estará disponible Facebook Login.';
            
            if (error.code === 'auth/popup-closed-by-user') {
                errorMessage = 'Inicio de sesión cancelado.';
            } else if (error.code === 'auth/popup-blocked') {
                errorMessage = 'Por favor permite ventanas emergentes para continuar.';
            } else if (error.code === 'auth/account-exists-with-different-credential') {
                errorMessage = 'Ya existe una cuenta con este email usando otro método.';
            }
            
            alert(errorMessage);
            
            // Ofrecer Google como alternativa
            const useGoogle = confirm('¿Te gustaría probar con Google mientras configuramos Facebook?');
            if (useGoogle) {
                signInWithGoogle();
            }
        }

        // Función para manejar autenticación con Google
        async function signInWithGoogle() {
            try {
                console.log('Iniciando autenticación con Google...');
                const result = await firebase.auth().signInWithPopup(googleProvider);
                const user = result.user;
                
                console.log('Usuario autenticado con Google:', user);
                
                // Redirigir a la página principal
                window.location.href = 'principal.html';
                
            } catch (error) {
                console.error('Error en autenticación con Google:', error);
                
                let errorMessage = 'Error al iniciar sesión con Google.';
                if (error.code === 'auth/popup-closed-by-user') {
                    errorMessage = 'Inicio de sesión cancelado.';
                } else if (error.code === 'auth/popup-blocked') {
                    errorMessage = 'Por favor permite ventanas emergentes para continuar.';
                } else if (error.code === 'auth/account-exists-with-different-credential') {
                    errorMessage = 'Ya existe una cuenta con este email usando otro método.';
                }
                
                alert(errorMessage);
            }
        }

        // Event listeners para los botones de redes sociales
        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching logic
            const showLoginBtn = document.getElementById('show-login');
            const showRegisterBtn = document.getElementById('show-register');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginError = document.getElementById('login-error');
            const registerError = document.getElementById('register-error');

            // Toggle between login and register forms
            if (showLoginBtn && showRegisterBtn && loginForm && registerForm) {
                showLoginBtn.addEventListener('click', () => {
                    loginForm.classList.remove('hidden');
                    registerForm.classList.add('hidden');
                    showLoginBtn.classList.add('bg-[#2bb7d1]', 'text-black');
                    showLoginBtn.classList.remove('bg-gray-700', 'text-gray-300');
                    showRegisterBtn.classList.remove('bg-[#2bb7d1]', 'text-black');
                    showRegisterBtn.classList.add('bg-gray-700', 'text-gray-300');
                    loginError.style.display = 'none';
                    registerError.style.display = 'none';
                });

                showRegisterBtn.addEventListener('click', () => {
                    registerForm.classList.remove('hidden');
                    loginForm.classList.add('hidden');
                    showRegisterBtn.classList.add('bg-[#2bb7d1]', 'text-black');
                    showRegisterBtn.classList.remove('bg-gray-700', 'text-gray-300');
                    showLoginBtn.classList.remove('bg-[#2bb7d1]', 'text-black');
                    showLoginBtn.classList.add('bg-gray-700', 'text-gray-300');
                    loginError.style.display = 'none';
                    registerError.style.display = 'none';
                });
            }

            // Botón de Facebook
            const facebookBtn = document.getElementById('facebook-login-btn');
            if (facebookBtn) {
                facebookBtn.addEventListener('click', signInWithFacebook);
            }

            // Botón de Google
            const googleBtn = document.getElementById('google-login-btn');
            if (googleBtn) {
                googleBtn.addEventListener('click', signInWithGoogle);
            }

            // Login form handler
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    loginError.style.display = 'none';

                    const email = loginForm.querySelector('#login-email').value;
                    const password = loginForm.querySelector('#login-password').value;

                    try {
                        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                        console.log('Usuario logueado:', userCredential.user);
                        window.location.href = 'principal.html';
                    } catch (error) {
                        console.error('Error en login:', error);
                        loginError.textContent = 'Email o contraseña incorrectos.';
                        loginError.style.display = 'block';
                    }
                });
            }

            // Register form handler
            if (registerForm) {
                registerForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    registerError.style.display = 'none';

                    const email = registerForm.querySelector('#register-email').value;
                    const password = registerForm.querySelector('#register-password').value;
                    const confirmPassword = registerForm.querySelector('#confirm-password').value;

                    if (password !== confirmPassword) {
                        registerError.textContent = 'Las contraseñas no coinciden.';
                        registerError.style.display = 'block';
                        return;
                    }

                    try {
                        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                        console.log('Usuario registrado:', userCredential.user);
                        window.location.href = 'principal.html';
                    } catch (error) {
                        console.error('Error en registro:', error);
                        let errorMessage = 'Error al crear la cuenta.';
                        if (error.code === 'auth/email-already-in-use') {
                            errorMessage = 'Este email ya está registrado.';
                        } else if (error.code === 'auth/invalid-email') {
                            errorMessage = 'Email inválido.';
                        } else if (error.code === 'auth/weak-password') {
                            errorMessage = 'La contraseña debe tener al menos 6 caracteres.';
                        }
                        registerError.textContent = errorMessage;
                        registerError.style.display = 'block';
                    }
                });
            }
        });
    </script>
</body>
</html>
