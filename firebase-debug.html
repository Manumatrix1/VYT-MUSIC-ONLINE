<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Debug - VYT Music</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        .status {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .success { background: #0f5132; color: #d1e7dd; }
        .error { background: #58151c; color: #f8d7da; }
        .warning { background: #664d03; color: #fff3cd; }
        .info { background: #055160; color: #b6effb; }
        .section {
            border: 1px solid #333;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
        }
        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0b5ed7; }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
    
    <!-- Firebase Scripts v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body>
    <h1>🔍 Firebase Debug Console - VYT Music</h1>
    
    <div class="section">
        <h2>📦 Carga de Scripts Firebase</h2>
        <div id="script-status"></div>
        <button onclick="checkScripts()">🔄 Verificar Scripts</button>
    </div>

    <div class="section">
        <h2>⚙️ Configuración Firebase</h2>
        <div id="config-status"></div>
        <button onclick="testConfig()">🧪 Probar Configuración</button>
    </div>

    <div class="section">
        <h2>🔗 Test de Conexión</h2>
        <div id="connection-status"></div>
        <button onclick="testConnection()">🌐 Probar Conexión</button>
    </div>

    <div class="section">
        <h2>📊 Información del Sistema</h2>
        <div id="system-info"></div>
        <button onclick="getSystemInfo()">ℹ️ Obtener Info</button>
    </div>

    <div class="section">
        <h2>📝 Console Log</h2>
        <pre id="console-log"></pre>
        <button onclick="clearLog()">🗑️ Limpiar</button>
    </div>

    <div class="section">
        <h2>🚀 Inicialización Manual</h2>
        <button onclick="manualInit()">🔧 Inicializar Firebase</button>
        <button onclick="loadConfig()">📁 Cargar Config</button>
    </div>

    <script>
        // Override console.log para capturar logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        const logs = [];
        
        function captureLog(level, ...args) {
            const timestamp = new Date().toLocaleTimeString();
            const message = args.join(' ');
            logs.push(`[${timestamp}] ${level.toUpperCase()}: ${message}`);
            updateConsoleLog();
            
            // Llamar al método original
            if (level === 'error') originalError(...args);
            else if (level === 'warn') originalWarn(...args);
            else originalLog(...args);
        }
        
        console.log = (...args) => captureLog('info', ...args);
        console.error = (...args) => captureLog('error', ...args);
        console.warn = (...args) => captureLog('warn', ...args);
        
        function updateConsoleLog() {
            document.getElementById('console-log').textContent = logs.slice(-20).join('\n');
        }
        
        function clearLog() {
            logs.length = 0;
            updateConsoleLog();
        }
        
        function addStatus(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            container.appendChild(div);
        }
        
        function clearStatus(containerId) {
            document.getElementById(containerId).innerHTML = '';
        }

        function checkScripts() {
            clearStatus('script-status');
            console.log('🔍 Verificando carga de scripts Firebase...');
            
            // Verificar Firebase global
            if (typeof firebase !== 'undefined') {
                addStatus('script-status', '✅ Firebase object está disponible', 'success');
                console.log('✅ Firebase object detectado');
                
                // Verificar componentes
                const components = ['auth', 'firestore', 'storage', 'apps'];
                components.forEach(comp => {
                    if (firebase[comp]) {
                        addStatus('script-status', `✅ firebase.${comp} disponible`, 'success');
                    } else {
                        addStatus('script-status', `❌ firebase.${comp} no disponible`, 'error');
                    }
                });
                
                // Verificar versión
                if (firebase.SDK_VERSION) {
                    addStatus('script-status', `📦 Versión: ${firebase.SDK_VERSION}`, 'info');
                }
                
            } else {
                addStatus('script-status', '❌ Firebase object no está disponible', 'error');
                console.error('❌ Firebase no está disponible globalmente');
            }
        }

        function testConfig() {
            clearStatus('config-status');
            console.log('⚙️ Probando configuración...');
            
            const config = {
                apiKey: "AIzaSyB_LRm2DUhQXwlaCFGc4pqzWs6OiMdRqlk",
                authDomain: "vytonlineprueva.firebaseapp.com",
                projectId: "vytonlineprueva",
                storageBucket: "vytonlineprueva.firebasestorage.app",
                messagingSenderId: "175483939728",
                appId: "1:175483939728:web:230294acca9221d1d1a115",
                measurementId: "G-PWRTMBH631"
            };
            
            addStatus('config-status', '📋 Configuración cargada:', 'info');
            addStatus('config-status', `🔑 API Key: ${config.apiKey.substring(0, 20)}...`, 'info');
            addStatus('config-status', `🌐 Auth Domain: ${config.authDomain}`, 'info');
            addStatus('config-status', `📁 Project ID: ${config.projectId}`, 'info');
            addStatus('config-status', `☁️ Storage Bucket: ${config.storageBucket}`, 'info');
            
            console.log('✅ Configuración verificada');
        }

        function manualInit() {
            console.log('🔧 Iniciando inicialización manual...');
            
            if (typeof firebase === 'undefined') {
                console.error('❌ Firebase no está disponible para inicialización');
                return;
            }
            
            try {
                const config = {
                    apiKey: "AIzaSyB_LRm2DUhQXwlaCFGc4pqzWs6OiMdRqlk",
                    authDomain: "vytonlineprueva.firebaseapp.com",
                    projectId: "vytonlineprueva",
                    storageBucket: "vytonlineprueva.firebasestorage.app",
                    messagingSenderId: "175483939728",
                    appId: "1:175483939728:web:230294acca9221d1d1a115",
                    measurementId: "G-PWRTMBH631"
                };
                
                // Verificar si ya hay una app inicializada
                if (firebase.apps.length === 0) {
                    const app = firebase.initializeApp(config);
                    console.log('✅ Firebase App inicializado manualmente');
                    
                    // Inicializar servicios
                    const auth = firebase.auth();
                    const db = firebase.firestore();
                    const storage = firebase.storage();
                    
                    console.log('✅ Servicios inicializados');
                    
                    // Hacer variables globales
                    window.firebase_app = app;
                    window.firebase_auth = auth;
                    window.firebase_db = db;
                    window.firebase_storage = storage;
                    
                    console.log('✅ Variables globales asignadas');
                    
                } else {
                    console.log('ℹ️ Firebase ya está inicializado');
                }
                
            } catch (error) {
                console.error('❌ Error en inicialización manual:', error);
            }
        }

        function loadConfig() {
            console.log('📁 Cargando configuración externa...');
            
            // Crear script tag para cargar firebase-config.js
            const script = document.createElement('script');
            script.src = 'firebase-config.js';
            script.onload = () => {
                console.log('✅ firebase-config.js cargado');
            };
            script.onerror = () => {
                console.error('❌ Error cargando firebase-config.js');
            };
            document.head.appendChild(script);
        }

        function testConnection() {
            clearStatus('connection-status');
            console.log('🌐 Probando conexión...');
            
            if (typeof firebase === 'undefined') {
                addStatus('connection-status', '❌ Firebase no disponible', 'error');
                return;
            }
            
            try {
                // Test básico de conexión
                addStatus('connection-status', '🔄 Probando conexión...', 'info');
                
                if (firebase.apps.length > 0) {
                    addStatus('connection-status', '✅ App Firebase conectada', 'success');
                    
                    // Test de Firestore
                    if (window.firebase_db) {
                        window.firebase_db.enableNetwork().then(() => {
                            addStatus('connection-status', '✅ Firestore conectado', 'success');
                        }).catch(err => {
                            addStatus('connection-status', `⚠️ Firestore: ${err.message}`, 'warning');
                        });
                    }
                    
                } else {
                    addStatus('connection-status', '⚠️ No hay apps inicializadas', 'warning');
                }
                
            } catch (error) {
                addStatus('connection-status', `❌ Error: ${error.message}`, 'error');
            }
        }

        function getSystemInfo() {
            clearStatus('system-info');
            
            addStatus('system-info', `🌐 User Agent: ${navigator.userAgent}`, 'info');
            addStatus('system-info', `📍 URL: ${window.location.href}`, 'info');
            addStatus('system-info', `🕒 Timestamp: ${new Date().toISOString()}`, 'info');
            addStatus('system-info', `🔗 Online: ${navigator.onLine}`, 'info');
            
            if (typeof firebase !== 'undefined') {
                addStatus('system-info', `📦 Firebase SDK: ${firebase.SDK_VERSION || 'unknown'}`, 'info');
                addStatus('system-info', `📱 Apps inicializadas: ${firebase.apps.length}`, 'info');
            }
            
            console.log('ℹ️ Información del sistema obtenida');
        }

        // Auto-run al cargar
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Debug console iniciado');
            setTimeout(() => {
                checkScripts();
                getSystemInfo();
            }, 500);
        });
    </script>
</body>
</html>
